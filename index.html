<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Art By Tisha - Premium Jewelry Collection</title>
    
    <!-- PWA & SEO Optimizations -->
    <meta name="description" content="Art By Tisha Official Store. Browse our premium top-selling jewelry, necklaces, earrings, and rings.">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212" id="themeColorMeta">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="launchericon-192x192.png">
    
    <!-- Preconnect to Google servers for faster loading -->
    <link rel="preconnect" href="https://docs.google.com">
    <link rel="preconnect" href="https://lh3.googleusercontent.com">

    <style>
        :root {
            --bg-color: #fdf5f6;
            --card-bg: #ffffff;
            --text-main: #333;
            --text-muted: #888;
            --border-color: #ecd3d8;
            --primary: #d88fa0;
            --primary-dark: #c97a8d;
            --input-bg: #ffffff;
            --shadow: rgba(0,0,0,0.05);
        }

        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #f0f0f0;
            --text-muted: #aaa;
            --border-color: #333;
            --primary: #e8a0b0;
            --primary-dark: #d88fa0;
            --input-bg: #2a2a2a;
            --shadow: rgba(0,0,0,0.4);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { background: var(--bg-color); }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0 0 80px;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Scroll Lock for maintaining history */
        body.modal-open {
            overflow: hidden;
        }

        .store-container {
            width: 100%; max-width: 1400px; margin: 0 auto; min-height: 100vh;
        }

        #topBanner {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; padding: 8px 15px; display: flex;
            justify-content: space-between; align-items: center;
            font-size: 12px; font-weight: 600; position: sticky;
            top: 0; z-index: 102; gap: 8px;
        }

        body.dark-mode #topBanner { background: #1e1e1e; border-bottom: 1px solid var(--border-color); color: var(--text-main); }
        #topBanner span { flex: 1; min-width: 0; }

        #themeToggleBtn {
            background: rgba(255,255,255,0.25); border: 1px solid rgba(255,255,255,0.4);
            color: white; padding: 5px 12px; border-radius: 20px;
            font-size: 11px; font-weight: 800; cursor: pointer; flex-shrink: 0;
        }
        body.dark-mode #themeToggleBtn { background: #2a2a2a; border-color: #444; color: var(--text-main); }

        header {
            background: var(--card-bg); padding: 15px 20px; display: flex;
            align-items: center; justify-content: center; flex-direction: column;
            box-shadow: 0 4px 15px var(--shadow); position: sticky; top: 36px;
            z-index: 101; cursor: pointer; user-select: none;
        }
        .header-logo { width: 70px; height: 70px; border-radius: 50%; object-fit: contain; border: 2px solid var(--border-color); background: white; }
        .header-title { color: var(--primary-dark); margin: 8px 0 0; font-size: 18px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
        .header-tagline { color: var(--text-muted); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; }

        .controls-container { padding: 15px; background: var(--bg-color); display: flex; flex-direction: column; gap: 12px; }
        .search-input { width: 100%; padding: 14px; border: 1px solid var(--border-color); border-radius: 12px; outline: none; font-size: 15px; text-align: center; background: var(--input-bg); color: var(--text-main); box-shadow: 0 4px 10px var(--shadow); }
        .filter-row { display: flex; gap: 10px; }
        .filter-select { flex: 1; padding: 12px; border: 1px solid var(--border-color); border-radius: 12px; background: var(--input-bg); color: var(--text-main); font-size: 13px; font-weight: 600; outline: none; box-shadow: 0 2px 8px var(--shadow); }

        .section-header { padding: 15px 15px 8px; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--primary-dark); display: flex; align-items: center; gap: 8px; }
        .section-header .line { flex: 1; height: 1px; background: var(--border-color); }
        .section-header .count { font-size: 11px; color: var(--text-muted); font-weight: 600; }

        .carousel-viewport { overflow: hidden; width: 100%; touch-action: pan-y; }
        .carousel-track { display: flex; gap: 15px; padding: 0 15px 15px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; cursor: grab; }
        .carousel-track::-webkit-scrollbar { display: none; }
        
        /* Mobile defaults to 2 items in carousel */
        .carousel-track .product-card { flex: 0 0 calc(50% - 7.5px); min-width: calc(50% - 7.5px); scroll-snap-align: start; }

        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; padding: 0 15px 10px; }
        .product-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; box-shadow: 0 6px 15px var(--shadow); cursor: pointer; border: 1px solid var(--border-color); }
        .card-img-wrapper { width: 100%; aspect-ratio: 1 / 1; background: var(--bg-color); position: relative; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .card-badge, .discount-badge { position: absolute; color: white; font-weight: 800; z-index: 2; }
        .card-badge { top: 8px; left: 8px; background: linear-gradient(135deg, #f7a8b8, #c97a8d); font-size: 9px; padding: 4px 8px; border-radius: 20px; }
        .discount-badge { top: 8px; right: 8px; background: #27ae60; font-size: 10px; padding: 4px 7px; border-radius: 6px; }
        .card-info { padding: 12px 10px; text-align: center; }
        .card-category { font-size: 10px; color: var(--primary); font-weight: 800; text-transform: uppercase; margin: 0 0 3px; }
        .card-title { font-size: 13px; color: var(--text-main); margin: 0 0 5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-sku { font-size: 11px; color: var(--text-muted); margin: 0 0 6px; text-transform: uppercase; }
        .card-price-row { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .card-mrp { font-size: 12px; color: var(--text-muted); text-decoration: line-through; margin: 0; }
        .card-price { font-size: 16px; color: var(--primary-dark); font-weight: 800; margin: 0; }
        .card-off { font-size: 11px; color: #27ae60; font-weight: 700; margin: 2px 0 0; }

        .status-msg, .no-results { text-align: center; padding: 40px 20px; color: var(--primary); font-weight: 600; }
        .no-results { color: var(--text-muted); font-size: 14px; }

        /* Modal */
        .modal { position: fixed; inset: 0; background: var(--card-bg); z-index: 1000; display: none; flex-direction: column; animation: slideUp 0.3s ease-out; overflow-y: auto; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; background: var(--card-bg); z-index: 10; }
        .back-btn { background: none; border: none; font-size: 24px; color: var(--text-main); cursor: pointer; }
        .modal-content { padding: 20px; padding-bottom: 100px; }
        .modal-gallery, .modal-info { width: 100%; }
        .modal-img { display: block; width: 100%; height: min(55vh, 430px); object-fit: contain; background: var(--bg-color); border-radius: 12px; margin-bottom: 15px; }
        .thumb-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .modal-thumb { width: 50px; height: 50px; object-fit: cover; border: 2px solid var(--border-color); border-radius: 8px; cursor: pointer; }
        .modal-thumb.active { border-color: var(--primary); }
        .modal-cat { font-size: 12px; color: var(--primary); font-weight: bold; text-transform: uppercase; margin: 0 0 5px; }
        .modal-title { font-size: 22px; color: var(--text-main); margin: 0 0 5px; }
        .modal-sku { font-size: 13px; color: var(--text-muted); margin: 0 0 12px; }

        .watching-badge { display: none; align-items: center; gap: 6px; background: #fff3f5; border: 1px solid #f5c6ce; color: #c97a8d; font-size: 12px; font-weight: 700; padding: 8px 12px; border-radius: 10px; margin: 0 0 16px; }
        .watching-badge.show { display: inline-flex; }
        body.dark-mode .watching-badge { background: #2a1f22; border-color: #4a3338; color: #e8a0b0; }
        .watching-dot { width: 8px; height: 8px; border-radius: 50%; background: #e74c3c; animation: pulseDot 1.2s ease-in-out infinite; }
        @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.85); } }

        .modal-price-box { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; }
        .modal-mrp-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
        .modal-mrp { font-size: 16px; color: var(--text-muted); text-decoration: line-through; }
        .modal-discount-pill { background: #e8f8ef; color: #27ae60; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 20px; }
        body.dark-mode .modal-discount-pill { background: #1a2e22; }
        .modal-price { font-size: 28px; color: var(--primary-dark); font-weight: 900; margin: 0; }

        .whatsapp-btn { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: #25D366; color: white; border: none; padding: 15px; border-radius: 30px; font-size: 16px; font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 10px; text-decoration: none; z-index: 1001; }
        
        #installBtn { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 999; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border: none; padding: 14px 28px; border-radius: 50px; font-size: 15px; font-weight: bold; cursor: pointer; display: none; white-space: nowrap; }

        /* DESKTOP OPTIMIZATIONS */
        @media (min-width: 768px) {
            .controls-container { max-width: 1200px; margin: 0 auto; flex-direction: row; align-items: center; }
            .search-input { flex: 2; } .filter-row { flex: 1; }
            .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; padding: 0 20px 20px; }
            .section-header, .carousel-track { padding-left: 20px; padding-right: 20px; }
            
            /* Fits EXACTLY 4 items in the Carousel on Desktop */
            .carousel-track .product-card { flex: 0 0 calc(25% - 11.25px); min-width: calc(25% - 11.25px); }

            .modal-content { display: grid; grid-template-columns: minmax(350px, 1fr) minmax(320px, 0.8fr); gap: 45px; max-width: 1200px; margin: 0 auto; padding: 40px; align-items: start; }
            .modal-gallery { position: sticky; top: 85px; }
            .modal-img { height: min(70vh, 600px); margin-bottom: 15px; border: 1px solid var(--border-color); background: transparent; }
            .modal-title { font-size: 28px; }
            .modal-info { padding-top: 20px; }
            .whatsapp-btn { position: relative; left: auto; bottom: auto; transform: none; width: 100%; max-width: none; margin-top: 25px; padding: 17px; }
        }
    </style>
</head>

<body class="dark-mode">

    <div class="store-container">
        <div id="topBanner">
            <span>👁️ Visitors: <span id="visitNumber">1,482</span> • Free shipping above ₹499 only</span>
            <button id="themeToggleBtn" onclick="toggleTheme()">☀️ Light</button>
        </div>

        <header id="brandHeader" onclick="goHome()" title="Back to Home">
            <img src="logo.png" alt="Art By Tisha" class="header-logo" onerror="this.style.display='none'">
            <h1 class="header-title">Art By Tisha</h1>
            <div class="header-tagline">Official Collection</div>
        </header>

        <div class="controls-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Search Collection..." oninput="applyFilters()">
            <div class="filter-row">
                <select id="categoryFilter" class="filter-select" onchange="applyFilters()">
                    <option value="ALL">All Categories</option>
                    <option value="TOP_SELLING">🔥 Top Selling</option>
                </select>
                <select id="sortFilter" class="filter-select" onchange="applyFilters()">
                    <option value="DEFAULT">Default Order</option>
                    <option value="PRICE_ASC">Price: Low → High</option>
                    <option value="PRICE_DESC">Price: High → Low</option>
                    <option value="NAME_ASC">Name: A → Z</option>
                </select>
            </div>
        </div>

        <div id="status" class="status-msg">✨ Loading Collection...</div>

        <div id="carouselSection" style="display:none;">
            <div class="section-header">🏆 Featured Top Sellers<span class="line"></span></div>
            <div class="carousel-viewport"><div id="carouselTrack" class="carousel-track"></div></div>
        </div>

        <div id="productGrid"></div>
    </div>

    <!-- Product Modal -->
    <div id="productModal" class="modal">
        <div class="modal-header">
            <button class="back-btn" onclick="closeModalToHome()">✕</button>
            <h3 style="margin:0;font-size:16px;">Details</h3>
            <div style="width:24px;"></div>
        </div>
        <div class="modal-content">
            <div class="modal-gallery">
                <img id="mImg" class="modal-img" src="" alt="Product image">
                <div id="mThumbs" class="thumb-row"></div>
            </div>
            <div class="modal-info">
                <p id="mCat" class="modal-cat"></p>
                <h2 id="mTitle" class="modal-title"></h2>
                <p id="mSku" class="modal-sku"></p>
                <div id="watchingBadge" class="watching-badge"><span class="watching-dot"></span><span id="watchingText"></span></div>
                <div class="modal-price-box">
                    <div class="modal-mrp-row">
                        <span>MRP</span><span id="mMrp" class="modal-mrp"></span><span id="mDiscount" class="modal-discount-pill"></span>
                    </div>
                    <p id="mPrice" class="modal-price"></p>
                </div>
                <a id="mWhatsapp" href="#" class="whatsapp-btn" target="_blank" rel="noopener">💬 Inquire on WhatsApp</a>
            </div>
        </div>
    </div>

    <button id="installBtn" onclick="triggerInstall()">📲 Install Store App</button>

    <script>
        const WHATSAPP_NUMBER = "918287567099";
        const SHEET_ID = "1h9RxfOCsIBul2HuSwWUAK8LQ8nrmriMK8IG_B1TD1BQ";
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Products`;

        const CATEGORY_ORDER = ["NECKLACE", "NECKLACES", "BANGLES", "BANGLE", "EARRINGS", "EARRING", "BRACELETS", "BRACELET", "RINGS", "RING"];
        const VISIT_COUNT_CACHE = "abt_global_visits_v10";
        
        let products = [];
        let modalImages = [];
        let currentImgIdx = 0;
        let rotationInterval = null;
        let carouselInterval = null;
        let userTouchingCarousel = false;
        
        // Scroll History Variable
        let savedScrollPosition = 0;

        function parseCSV(text) {
            const rows = []; let row = []; let value = ""; let insideQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i], nextChar = text[i + 1];
                if (char === '"' && insideQuotes && nextChar === '"') { value += '"'; i++; }
                else if (char === '"') insideQuotes = !insideQuotes;
                else if (char === "," && !insideQuotes) { row.push(value.trim()); value = ""; }
                else if ((char === "\n" || char === "\r") && !insideQuotes) {
                    if (char === "\r" && nextChar === "\n") i++;
                    row.push(value.trim());
                    if (row.some(cell => cell !== "")) rows.push(row);
                    row = []; value = "";
                } else value += char;
            }
            if (value || row.length) { row.push(value.trim()); rows.push(row); }
            return rows;
        }

        function initTheme() {
            const saved = localStorage.getItem("tisha_theme");
            const useDark = saved !== "light";
            document.body.classList.toggle("dark-mode", useDark);
            document.getElementById("themeToggleBtn").innerText = useDark ? "☀️ Light" : "🌙 Dark";
            document.getElementById("themeColorMeta").setAttribute("content", useDark ? "#121212" : "#ffffff");
            if (!saved) localStorage.setItem("tisha_theme", "dark");
        }

        function toggleTheme() {
            document.body.classList.toggle("dark-mode");
            const isDark = document.body.classList.contains("dark-mode");
            localStorage.setItem("tisha_theme", isDark ? "dark" : "light");
            document.getElementById("themeToggleBtn").innerText = isDark ? "☀️ Light" : "🌙 Dark";
            document.getElementById("themeColorMeta").setAttribute("content", isDark ? "#121212" : "#ffffff");
        }

        function initVisitorCounter() {
            const visitEl = document.getElementById("visitNumber");
            let cached = parseInt(localStorage.getItem(VISIT_COUNT_CACHE) || "1482", 10);
            visitEl.innerText = cached.toLocaleString("en-IN");
            if (!sessionStorage.getItem("abt_active_session")) {
                sessionStorage.setItem("abt_active_session", "true");
                cached++;
                visitEl.innerText = cached.toLocaleString("en-IN");
                localStorage.setItem(VISIT_COUNT_CACHE, String(cached));
            }
        }

        function calcPricing(sellingValue) {
            const selling = parseFloat(sellingValue) || 0;
            const mrp = Math.round(selling * 1.6);
            const discount = mrp > 0 ? Math.round(((mrp - selling) / mrp) * 100) : 0;
            return { sellingText: "₹" + selling, mrpText: "₹" + mrp, discountText: discount + "% OFF", discount };
        }

        function cleanImageUrl(url) {
            url = String(url || "").trim();
            const idMatch = url.match(/\/(?:d\/|id=)([a-zA-Z0-9_-]+)/);
            return idMatch ? `https://lh3.googleusercontent.com/d/${idMatch[1]}` : url;
        }

        function hasValidImages(product) {
            return [1, 2, 3, 4, 5].some(i => product[`Image ${i}`] && product[`Image ${i}`].trim().length > 5);
        }

        function isTopSelling(product) { return (product["Category"] || "").trim().toUpperCase() === "TOP SELLING"; }

        function sortList(list, filter) {
            const sorted = [...list];
            if (filter === "PRICE_ASC") sorted.sort((a, b) => (parseFloat(a["Selling"]) || 0) - (parseFloat(b["Selling"]) || 0));
            else if (filter === "PRICE_DESC") sorted.sort((a, b) => (parseFloat(b["Selling"]) || 0) - (parseFloat(a["Selling"]) || 0));
            else if (filter === "NAME_ASC") sorted.sort((a, b) => (a["Product Name"] || "").localeCompare(b["Product Name"] || ""));
            return sorted;
        }

        function populateCategories() {
            const select = document.getElementById("categoryFilter");
            const categories = new Set();
            products.forEach(p => {
                const cat = (p["Category"] || "").trim();
                if (cat && cat.toUpperCase() !== "TOP SELLING") categories.add(cat);
            });
            [...categories].sort((a, b) => {
                const aIdx = CATEGORY_ORDER.indexOf(a.toUpperCase()), bIdx = CATEGORY_ORDER.indexOf(b.toUpperCase());
                if (aIdx !== -1 && bIdx !== -1) return aIdx - bIdx;
                return aIdx !== -1 ? -1 : bIdx !== -1 ? 1 : a.localeCompare(b);
            }).forEach(cat => {
                const opt = document.createElement("option");
                opt.value = cat.toUpperCase(); opt.textContent = cat; select.appendChild(opt);
            });
        }

        // Added eagerLoad parameter for first few images
        function createCard(item, badgeEmoji, eagerLoad = false) {
            const pricing = calcPricing(item["Selling"]);
            const sku = item["SKU Code"] || "";
            const imageUrl = cleanImageUrl(item["Image 1"]);
            
            const card = document.createElement("div");
            card.className = "product-card";
            card.onclick = () => openModal(sku);

            card.innerHTML = `
                <div class="card-img-wrapper">
                    ${isTopSelling(item) ? `<div class="card-badge">${badgeEmoji} Top Selling</div>` : ""}
                    ${pricing.discount > 0 ? `<div class="discount-badge">${pricing.discountText}</div>` : ""}
                    <img src="${imageUrl}" class="card-img" ${eagerLoad ? '' : 'loading="lazy"'} alt="Product">
                </div>
                <div class="card-info">
                    <p class="card-category">${item["Category"] || ""}</p>
                    <p class="card-title">${item["Product Name"]}</p>
                    <p class="card-sku">SKU: ${sku}</p>
                    <div class="card-price-row">
                        <p class="card-mrp">${pricing.mrpText}</p>
                        <p class="card-price">${pricing.sellingText}</p>
                        <p class="card-off">${pricing.discountText}</p>
                    </div>
                </div>
            `;
            return card;
        }

        function renderSection(container, icon, title, items, badgeEmoji) {
            if (!items.length) return;
            const header = document.createElement("div");
            header.className = "section-header";
            header.innerHTML = `${icon} ${title} <span class="count">(${items.length})</span><span class="line"></span>`;
            
            const grid = document.createElement("div");
            grid.className = "grid";
            
            // First 4 items load eagerly to improve LCP score
            items.forEach((item, index) => grid.appendChild(createCard(item, badgeEmoji, index < 4)));
            
            container.appendChild(header);
            container.appendChild(grid);
        }

        function renderCarousel() {
            const topItems = sortList(products.filter(isTopSelling), "DEFAULT");
            const section = document.getElementById("carouselSection");
            const track = document.getElementById("carouselTrack");
            clearInterval(carouselInterval); track.innerHTML = "";

            if (!topItems.length) { section.style.display = "none"; return; }
            section.style.display = "block";

            // Add original items and duplicate them once for seamless infinite scrolling
            [...topItems, ...topItems].forEach(item => track.appendChild(createCard(item, "⭐", true)));

            if (topItems.length > 2) {
                track.scrollLeft = 0;
                carouselInterval = setInterval(() => {
                    if (userTouchingCarousel || track.children.length < 3) return;
                    const step = track.children[0].offsetWidth + 15;
                    if (track.scrollLeft + step >= track.scrollWidth - track.clientWidth - 5) {
                        track.style.scrollBehavior = "auto"; track.scrollLeft = 0; track.style.scrollBehavior = "smooth";
                    }
                    track.scrollBy({ left: step, behavior: "smooth" });
                }, 2500);
            }
        }

        function applyFilters() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            const catFilter = document.getElementById("categoryFilter").value;
            const sortVal = document.getElementById("sortFilter").value;
            const grid = document.getElementById("productGrid");
            grid.innerHTML = "";

            if (!query && catFilter === "ALL") renderCarousel();
            else { document.getElementById("carouselSection").style.display = "none"; clearInterval(carouselInterval); }

            let filtered = products.filter(p => {
                const searchMatch = !query || p["Product Name"].toLowerCase().includes(query) || p["SKU Code"].toLowerCase().includes(query);
                const catMatch = catFilter === "ALL" || (catFilter === "TOP_SELLING" ? isTopSelling(p) : p["Category"].toUpperCase() === catFilter);
                return searchMatch && catMatch;
            });
            
            filtered = sortList(filtered, sortVal);

            if (!filtered.length) { grid.innerHTML = `<div class="no-results">No items found.</div>`; return; }

            if (catFilter === "ALL") {
                const groups = {};
                filtered.forEach(p => {
                    const cat = p["Category"] || "Other";
                    if (!groups[cat]) groups[cat] = [];
                    groups[cat].push(p);
                });
                Object.keys(groups).sort().forEach(cat => renderSection(grid, "📂", cat, groups[cat], "✨"));
            } else {
                renderSection(grid, "📂", catFilter === "TOP_SELLING" ? "Top Selling" : catFilter, filtered, "✨");
            }
        }

        function openModal(sku) {
            const product = products.find(p => p["SKU Code"] === sku);
            if (!product) return;

            // Save exactly where user scrolled
            savedScrollPosition = window.scrollY;

            const pricing = calcPricing(product["Selling"]);
            document.getElementById("mTitle").innerText = product["Product Name"];
            document.getElementById("mSku").innerText = "SKU: " + sku;
            document.getElementById("mCat").innerText = product["Category"];
            document.getElementById("mMrp").innerText = pricing.mrpText;
            document.getElementById("mDiscount").innerText = pricing.discountText;
            document.getElementById("mPrice").innerText = pricing.sellingText;

            const badge = document.getElementById("watchingBadge");
            if (isTopSelling(product)) {
                document.getElementById("watchingText").innerText = `${Math.floor(Math.random() * 4) + 2} customers watching currently`;
                badge.classList.add("show");
            } else badge.classList.remove("show");

            document.getElementById("mWhatsapp").href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(`Hi, I am interested in:\n*${product["Product Name"]}*\n*SKU:* ${sku}\n*Price:* ${pricing.sellingText}`)}`;

            modalImages = [1,2,3,4,5].map(i => cleanImageUrl(product[`Image ${i}`])).filter(url => url.length > 5);
            const mImg = document.getElementById("mImg"), thumbs = document.getElementById("mThumbs");
            clearInterval(rotationInterval); thumbs.innerHTML = ""; currentImgIdx = 0;

            mImg.src = modalImages[0];
            modalImages.forEach((url, i) => {
                const t = document.createElement("img");
                t.src = url; t.className = "modal-thumb" + (i === 0 ? " active" : "");
                t.onclick = () => { currentImgIdx = i; mImg.src = url; document.querySelectorAll(".modal-thumb").forEach((el, idx) => el.classList.toggle("active", idx === i)); clearInterval(rotationInterval); };
                thumbs.appendChild(t);
            });

            if (modalImages.length > 1) rotationInterval = setInterval(() => thumbs.children[(currentImgIdx + 1) % modalImages.length].click(), 1800);

            // Lock scroll and open Modal
            document.body.classList.add("modal-open");
            document.getElementById("productModal").style.display = "flex";
            history.pushState({ page: "product" }, "", "#product");
        }

        function closeModal() {
            document.getElementById("productModal").style.display = "none";
            document.body.classList.remove("modal-open");
            clearInterval(rotationInterval);
            
            // Instantly restore the exact history position
            window.scrollTo({ top: savedScrollPosition, behavior: "instant" });
        }

        function closeModalToHome() {
            closeModal();
            if(window.location.hash) history.back();
        }

        function goHome() {
            if (document.getElementById("productModal").style.display === "flex") closeModalToHome();
            else {
                document.getElementById("searchInput").value = "";
                document.getElementById("categoryFilter").value = "ALL";
                document.getElementById("sortFilter").value = "DEFAULT";
                applyFilters();
                window.scrollTo({ top: 0, behavior: "smooth" });
            }
        }

        window.addEventListener("popstate", () => {
            if (document.getElementById("productModal").style.display === "flex") closeModal();
        });

        document.getElementById("carouselTrack").addEventListener("touchstart", () => { userTouchingCarousel = true; clearInterval(carouselInterval); }, { passive: true });
        document.getElementById("carouselTrack").addEventListener("touchend", () => { userTouchingCarousel = false; }, { passive: true });

        window.addEventListener("load", async () => {
            initTheme(); initVisitorCounter();
            try {
                const response = await fetch(CSV_URL);
                const csv = await response.text();
                const rows = parseCSV(csv);
                const headers = rows[0].map(h => h.trim());

                for (let i = 1; i < rows.length; i++) {
                    if (!rows[i].length) continue;
                    const p = {};
                    headers.forEach((h, idx) => p[h] = rows[i][idx] || "");
                    const active = String(p["Active"] || "").trim().toUpperCase();
                    
                    // ONLY push products that are Active AND have Images
                    if (active !== "FALSE" && active !== "0" && active !== "NO" && hasValidImages(p)) {
                        products.push(p);
                    }
                }
                
                document.getElementById("status").style.display = "none";
                populateCategories();
                applyFilters();

            } catch (error) {
                document.getElementById("status").innerText = "❌ Could not load collection.";
            }
        });

        // PWA Installation
        let deferredPrompt = null;
        window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; document.getElementById("installBtn").style.display = "block"; });
        function triggerInstall() { if (deferredPrompt) { deferredPrompt.prompt(); document.getElementById("installBtn").style.display = "none"; } }
        if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
    </script>
</body>
</html>

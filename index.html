    <style>
        :root {
            --bg-color: #fdf5f6;
            --card-bg: #ffffff;
            --text-main: #333;
            --text-muted: #888;
            --border-color: #ecd3d8;
            --primary: #d88fa0;
            --primary-dark: #c97a8d;
            --input-bg: #ffffff;
            --shadow: rgba(0,0,0,0.05);

            --carousel-pad: 15px;
            --carousel-gap: 15px;
            --carousel-cols: 2;
            --carousel-item-width: calc((100% - (var(--carousel-pad) * 2) - (var(--carousel-gap) * (var(--carousel-cols) - 1))) / var(--carousel-cols));
        }

        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #f0f0f0;
            --text-muted: #aaa;
            --border-color: #333;
            --primary: #e8a0b0;
            --primary-dark: #d88fa0;
            --input-bg: #2a2a2a;
            --shadow: rgba(0,0,0,0.4);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { background: var(--bg-color); }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0 0 90px;
            transition: background-color 0.3s, color 0.3s;
        }

        body.modal-open { overflow: hidden; }

        .store-container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            min-height: 100vh;
        }

        #topBanner {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 102;
            gap: 8px;
        }

        body.dark-mode #topBanner {
            background: #1e1e1e;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        #topBanner .banner-text {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #themeToggleBtn {
            background: rgba(255,255,255,0.25);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            flex-shrink: 0;
        }

        body.dark-mode #themeToggleBtn {
            background: #2a2a2a;
            border-color: #444;
            color: var(--text-main);
        }

        header {
            background: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            box-shadow: 0 4px 15px var(--shadow);
            position: sticky;
            top: 36px;
            z-index: 101;
            cursor: pointer;
            user-select: none;
        }

        .header-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: contain;
            border: 2px solid var(--border-color);
            background: white;
        }

        .header-title {
            color: var(--primary-dark);
            margin: 8px 0 0;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header-tagline {
            color: var(--text-muted);
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .controls-container {
            padding: 15px;

            flex-direction: column;

            background: var(--card-bg);

            align-items: center;
            justify-content: space-between;

        /* Carousel - Scroll Fix Included */
        .carousel-viewport {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-padding-inline: var(--carousel-pad);
            -webkit-overflow-scrolling: touch;
            
            /* CRUCIAL: Allow vertical page scrolling on carousel */
            touch-action: pan-x pan-y;
            overscroll-behavior-x: contain;

            cursor: grab;
            scrollbar-width: none;
        }

        .carousel-viewport:active { cursor: grabbing; }
        .carousel-viewport::-webkit-scrollbar { display: none; }

        .carousel-track {
            display: flex;
            gap: var(--carousel-gap);
            padding: 10px var(--carousel-pad) 20px;
            width: max-content;
            min-width: 100%;
            box-sizing: border-box;

            width: var(--carousel-item-width);
            max-width: var(--carousel-item-width);
            scroll-snap-align: start;
            scroll-snap-stop: always;

        const WHATSAPP_NUMBER = "918287567099";
        const SHEET_ID = "1h9RxfOCsIBul2HuSwWUAK8LQ8nrmriMK8IG_B1TD1BQ";
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Products`;

        const CATEGORY_ORDER = [
            "TOP SELLING",
            "NECKLACE", "NECKLACES",
            "RINGS", "RING",
            "BRACELETS", "BRACELET",
            "BANGLES", "BANGLE",
            "EARRINGS", "EARRING"
        ];

        const NOTIFY_PREF_KEY = "abt_notify_enabled_v1";
        const CAROUSEL_SPEED = 2500;

        let products = [];
        let modalImages = [];
        let currentImgIdx = 0;
        let rotationInterval = null;
        let carouselInterval = null;
        let userTouchingCarousel = false;
        let savedScrollPosition = 0;
        let carouselItemWidth = 0;
        let carouselGap = 15;
        let deferredPrompt = null;
        let oneSignalReady = false;

        /* ---------------- CSV ---------------- */
        function parseCSV(text) {
            const rows = [];
            let row = [];
            let value = "";
            let insideQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (char === '"' && insideQuotes && nextChar === '"') {
                    value += '"';
                    i++;
                } else if (char === '"') {
                    insideQuotes = !insideQuotes;
                } else if (char === "," && !insideQuotes) {
                    row.push(value.trim());
                    value = "";
                } else if ((char === "\n" || char === "\r") && !insideQuotes) {
                    if (char === "\r" && nextChar === "\n") i++;
                    row.push(value.trim());
                    if (row.some(cell => cell !== "")) rows.push(row);
                    row = [];
                    value = "";
                } else {
                    value += char;
                }
            }

            if (value || row.length) {
                row.push(value.trim());
                rows.push(row);
            }
            return rows;
        }

        /* ---------------- Theme ---------------- */
        function initTheme() {
            const saved = localStorage.getItem("tisha_theme");
            const useDark = saved !== "light";
            document.body.classList.toggle("dark-mode", useDark);
            document.getElementById("themeToggleBtn").innerText = useDark ? "☀️ Light" : "🌙 Dark";
            document.getElementById("themeColorMeta").setAttribute("content", useDark ? "#121212" : "#ffffff");
            if (!saved) localStorage.setItem("tisha_theme", "dark");
        }

        function toggleTheme() {
            document.body.classList.toggle("dark-mode");
            const isDark = document.body.classList.contains("dark-mode");
            localStorage.setItem("tisha_theme", isDark ? "dark" : "light");
            document.getElementById("themeToggleBtn").innerText = isDark ? "☀️ Light" : "🌙 Dark";
            document.getElementById("themeColorMeta").setAttribute("content", isDark ? "#121212" : "#ffffff");
        }

        /* ---------------- Notifications ---------------- */
        function hideNotifyBar() {
            const bar = document.getElementById("notifyBar");
            if (bar) bar.style.display = "none";
        }

        function updateNotifyUI(state) {
            const btn = document.getElementById("notifyBtn");
            const bar = document.getElementById("notifyBar");
            if (!btn || !bar) return;

            // If user enables it, permanently hide the bar
            if (state === "granted") {
                localStorage.setItem(NOTIFY_PREF_KEY, "1");
                hideNotifyBar();
                return;
            }

            // If user blocks it, hide the bar as well
            if (state === "denied") {
                hideNotifyBar();
                return;
            }

            // Otherwise, show it and allow them to click enable
            bar.style.display = "flex";
            btn.textContent = "Enable";
            btn.disabled = false;
            btn.classList.remove("enabled");
        }

        function initNotifyUI() {
            const bar = document.getElementById("notifyBar");

            if (!("Notification" in window)) {
                if (bar) bar.style.display = "none";
                return;
            }

            if (localStorage.getItem(NOTIFY_PREF_KEY) === "1") {
                hideNotifyBar();
                return;
            }

            if (Notification.permission === "granted") {
                updateNotifyUI("granted");
                return;
            }

            if (Notification.permission === "denied") {
                updateNotifyUI("denied");
                return;
            }

            updateNotifyUI("default");
        }

        async function showLocalNotification(title, body) {
            const options = {
                body,
                icon: "launchericon-192x192.png",
                badge: "launchericon-192x192.png",
                data: { url: location.origin + location.pathname },
                vibrate: [80, 40, 80]
            };

            try {
                const reg = await navigator.serviceWorker?.ready;
                if (reg) {
                    await reg.showNotification(title, options);
                    return;
                }
            } catch (e) {}

            if (Notification.permission === "granted") {
                new Notification(title, options);
            }
        }

        async function enableOfferNotifications() {
            if (!("Notification" in window)) {
                alert("Notifications are not supported on this device/browser.");
                return;
            }

            if (ONESIGNAL_APP_ID && window.OneSignalDeferred) {
                window.OneSignalDeferred.push(async function(OneSignal) {
                    try {
                        await OneSignal.Notifications.requestPermission();
                        const permitted = await OneSignal.Notifications.getPermission();
                        if (permitted) {
                            updateNotifyUI("granted");
                            await showLocalNotification(
                                "Art By Tisha",
                                "You’re subscribed! We’ll notify you about new offers."
                            );
                        } else if (Notification.permission === "denied") {
                            updateNotifyUI("denied");
                            alert("Notifications are blocked. Enable them in browser/app settings.");
                        }
                    } catch (err) {
                        console.log("OneSignal permission error:", err);
                        await nativeNotifyFlow();
                    }
                });
                return;
            }

            await nativeNotifyFlow();
        }

        async function nativeNotifyFlow() {
            try {
                const permission = await Notification.requestPermission();
                if (permission === "granted") {
                    updateNotifyUI("granted");
                    await showLocalNotification(
                        "Art By Tisha",
                        "You’re all set! We’ll alert you about new designs & offers."
                    );
                } else if (permission === "denied") {
                    updateNotifyUI("denied");
                    alert("Notifications are blocked. Enable them in browser/site settings.");
                } else {
                    updateNotifyUI("default");
                }
            } catch (err) {
                console.log(err);
                alert("Could not enable notifications on this device.");
            }
        }

        function loadOneSignal() {
            if (!ONESIGNAL_APP_ID) return;

            window.OneSignalDeferred = window.OneSignalDeferred || [];
            window.OneSignalDeferred.push(async function(OneSignal) {
                await OneSignal.init({
                    appId: ONESIGNAL_APP_ID,
                    allowLocalhostAsSecureOrigin: true,
                    notifyButton: { enable: false },
                    serviceWorkerPath: "sw.js",
                    serviceWorkerParam: { scope: "/" }
                });
                oneSignalReady = true;

                const permitted = await OneSignal.Notifications.getPermission();
                if (permitted) updateNotifyUI("granted");
            });

            const s = document.createElement("script");
            s.src = "https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js";
            s.defer = true;
            document.head.appendChild(s);
        }

        /* ---------------- Helpers ---------------- */
        function calcPricing(sellingValue) {
            const selling = parseFloat(sellingValue) || 0;
            const mrp = Math.round(selling * 1.6);
            const discount = mrp > 0 ? Math.round(((mrp - selling) / mrp) * 100) : 0;
            return {
                sellingText: "₹" + selling,
                mrpText: "₹" + mrp,
                discountText: discount + "% OFF",
                discount
            };
        }

        function cleanImageUrl(url) {
            url = String(url || "").trim();
            const idMatch = url.match(/\/(?:d\/|id=)([a-zA-Z0-9_-]+)/);
            return idMatch ? `https://lh3.googleusercontent.com/d/${idMatch[1]}` : url;
        }

        function hasValidImages(product) {
            return [1, 2, 3, 4, 5].some(i => product[`Image ${i}`] && product[`Image ${i}`].trim().length > 5);
        }

        function isTopSelling(product) {
            return (product["Category"] || "").trim().toUpperCase() === "TOP SELLING";
        }

        function sortList(list, filter) {
            const sorted = [...list];
            if (filter === "PRICE_ASC") {
                sorted.sort((a, b) => (parseFloat(a["Selling"]) || 0) - (parseFloat(b["Selling"]) || 0));
            } else if (filter === "PRICE_DESC") {
                sorted.sort((a, b) => (parseFloat(b["Selling"]) || 0) - (parseFloat(a["Selling"]) || 0));
            } else if (filter === "NAME_ASC") {
                sorted.sort((a, b) => (a["Product Name"] || "").localeCompare(b["Product Name"] || ""));
            }
            return sorted;
        }

        function categorySortIndex(name) {
            return CATEGORY_ORDER.indexOf(String(name || "").toUpperCase());
        }

        function sortCategoryNames(names) {
            return [...names].sort((a, b) => {
                const aIdx = categorySortIndex(a);
                const bIdx = categorySortIndex(b);
                if (aIdx !== -1 && bIdx !== -1) return aIdx - bIdx;
                if (aIdx !== -1) return -1;
                if (bIdx !== -1) return 1;
                return a.localeCompare(b);
            });
        }

        function populateCategories() {
            const select = document.getElementById("categoryFilter");
            const categories = new Set();

            products.forEach(p => {
                const cat = (p["Category"] || "").trim();
                if (cat && cat.toUpperCase() !== "TOP SELLING") categories.add(cat);
            });

            sortCategoryNames([...categories]).forEach(cat => {
                const opt = document.createElement("option");
                opt.value = cat.toUpperCase();
                opt.textContent = cat;
                select.appendChild(opt);
            });
        }

        function updateCarouselMetrics() {
            const viewport = document.getElementById("carouselViewport");
            if (!viewport) return;

            const isDesktop = window.matchMedia("(min-width: 768px)").matches;
            const cols = isDesktop ? 4 : 2;
            const gap = isDesktop ? 20 : 15;
            const pad = isDesktop ? 20 : 15;

            const viewportWidth = viewport.clientWidth || window.innerWidth;
            const usable = viewportWidth - (pad * 2) - (gap * (cols - 1));
            const itemWidth = Math.max(120, Math.floor(usable / cols * 1000) / 1000);

            carouselGap = gap;
            carouselItemWidth = itemWidth;

            const apply = (el) => {
                el.style.setProperty("--carousel-cols", String(cols));
                el.style.setProperty("--carousel-gap", gap + "px");
                el.style.setProperty("--carousel-pad", pad + "px");
                el.style.setProperty("--carousel-item-width", itemWidth + "px");
            };

            apply(viewport);
            apply(document.documentElement);
        }

        function createCard(item, badgeEmoji, eagerLoad = false) {
            const pricing = calcPricing(item["Selling"]);
            const sku = item["SKU Code"] || "";
            const imageUrl = cleanImageUrl(item["Image 1"]);

            const card = document.createElement("div");
            card.className = "product-card";
            card.onclick = () => openModal(sku);

            card.innerHTML = `
                <div class="card-img-wrapper">
                    ${isTopSelling(item) ? `<div class="card-badge">${badgeEmoji} Top Selling</div>` : ""}
                    ${pricing.discount > 0 ? `<div class="discount-badge">${pricing.discountText}</div>` : ""}
                    <img src="${imageUrl}" class="card-img" ${eagerLoad ? "" : 'loading="lazy"'} alt="${item["Product Name"] || "Product"}">
                </div>
                <div class="card-info">
                    <p class="card-category">${item["Category"] || ""}</p>
                    <p class="card-title">${item["Product Name"] || ""}</p>
                    <p class="card-sku">SKU: ${sku}</p>
                    <div class="card-price-row">
                        <p class="card-mrp">${pricing.mrpText}</p>
                        <p class="card-price">${pricing.sellingText}</p>
                        <p class="card-off">${pricing.discountText}</p>
                    </div>
                </div>
            `;
            return card;
        }

        function renderSection(container, icon, title, items, badgeEmoji) {
            if (!items.length) return;

            const header = document.createElement("div");
            header.className = "section-header";
            header.innerHTML = `${icon} ${title} <span class="count">(${items.length})</span><span class="line"></span>`;

            const grid = document.createElement("div");
            grid.className = "grid";
            items.forEach((item, index) => grid.appendChild(createCard(item, badgeEmoji, index < 4)));

            container.appendChild(header);
            container.appendChild(grid);
        }

        function getCarouselStep() {
            const track = document.getElementById("carouselTrack");
            const first = track && track.children[0];
            if (first) {
                const style = getComputedStyle(track);
                const gap = parseFloat(style.gap) || carouselGap || 0;
                return first.getBoundingClientRect().width + gap;
            }
            return (carouselItemWidth || 200) + (carouselGap || 15);
        }

        function startInfiniteCarousel() {
            const viewport = document.getElementById("carouselViewport");
            const track = document.getElementById("carouselTrack");
            clearInterval(carouselInterval);
            if (!viewport || !track || track.children.length < 3) return;

            carouselInterval = setInterval(() => {
                if (userTouchingCarousel) return;

                const step = getCarouselStep();
                const maxScroll = viewport.scrollWidth - viewport.clientWidth;

                if (viewport.scrollLeft + step >= maxScroll - 2) {
                    viewport.style.scrollBehavior = "auto";
                    viewport.scrollLeft = 0;
                    requestAnimationFrame(() => {
                        viewport.style.scrollBehavior = "smooth";
                        viewport.scrollBy({ left: step, behavior: "smooth" });
                    });
                    return;
                }

                viewport.scrollBy({ left: step, behavior: "smooth" });
            }, CAROUSEL_SPEED);
        }

        function renderCarousel() {
            const topItems = sortList(products.filter(isTopSelling), "DEFAULT");
            const section = document.getElementById("carouselSection");
            const track = document.getElementById("carouselTrack");
            const viewport = document.getElementById("carouselViewport");

            clearInterval(carouselInterval);
            track.innerHTML = "";

            if (!topItems.length) {
                section.style.display = "none";
                return;
            }

            section.style.display = "block";
            updateCarouselMetrics();

            const loopItems = topItems.length > 2 ? [...topItems, ...topItems] : [...topItems];
            loopItems.forEach(item => track.appendChild(createCard(item, "⭐", true)));

            requestAnimationFrame(() => {
                updateCarouselMetrics();
                viewport.scrollLeft = 0;
                if (topItems.length > 2) startInfiniteCarousel();
            });
        }

        function applyFilters() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            const catFilter = document.getElementById("categoryFilter").value;
            const sortVal = document.getElementById("sortFilter").value;
            const grid = document.getElementById("productGrid");
            grid.innerHTML = "";

            if (!query && catFilter === "ALL") {
                renderCarousel();
            } else {
                document.getElementById("carouselSection").style.display = "none";
                clearInterval(carouselInterval);
            }

            let filtered = products.filter(p => {
                const name = (p["Product Name"] || "").toLowerCase();
                const sku = (p["SKU Code"] || "").toLowerCase();
                const cat = (p["Category"] || "").trim().toUpperCase();

                const searchMatch = !query || name.includes(query) || sku.includes(query);
                let catMatch = true;

                if (catFilter === "TOP_SELLING") catMatch = cat === "TOP SELLING";
                else if (catFilter !== "ALL") catMatch = cat === catFilter;

                return searchMatch && catMatch;
            });

            filtered = sortList(filtered, sortVal);

            if (!filtered.length) {
                grid.innerHTML = `<div class="no-results">No items found.</div>`;
                return;
            }

            if (catFilter === "ALL") {
                const groups = {};

                filtered.forEach(p => {
                    if (!query && isTopSelling(p)) return;
                    const cat = (p["Category"] || "").trim() || "Other";
                    if (!groups[cat]) groups[cat] = [];
                    groups[cat].push(p);
                });

                if (query) {
                    filtered.forEach(p => {
                        if (!isTopSelling(p)) return;
                        const cat = (p["Category"] || "").trim() || "Other";
                        if (!groups[cat]) groups[cat] = [];
                        if (!groups[cat].includes(p)) groups[cat].push(p);
                    });
                }

                sortCategoryNames(Object.keys(groups)).forEach(cat => {
                    renderSection(grid, "📂", cat, groups[cat], "✨");
                });
            } else {
                renderSection(
                    grid,
                    "📂",
                    catFilter === "TOP_SELLING" ? "Top Selling" : catFilter,
                    filtered,
                    "✨"
                );
            }
        }

        function openModal(sku) {
            const product = products.find(p => p["SKU Code"] === sku);
            if (!product) return;

            savedScrollPosition = window.scrollY;

            const pricing = calcPricing(product["Selling"]);
            document.getElementById("mTitle").innerText = product["Product Name"] || "";
            document.getElementById("mSku").innerText = "SKU: " + sku;
            document.getElementById("mCat").innerText = product["Category"] || "";
            document.getElementById("mMrp").innerText = pricing.mrpText;
            document.getElementById("mDiscount").innerText = pricing.discountText;
            document.getElementById("mPrice").innerText = pricing.sellingText;

            const badge = document.getElementById("watchingBadge");
            if (isTopSelling(product)) {
                document.getElementById("watchingText").innerText =
                    `${Math.floor(Math.random() * 4) + 2} customers watching currently`;
                badge.classList.add("show");
            } else {
                badge.classList.remove("show");
            }

            document.getElementById("mWhatsapp").href =
                `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(
                    `Hi, I am interested in:\n*${product["Product Name"]}*\n*SKU:* ${sku}\n*Price:* ${pricing.sellingText}`
                )}`;

            modalImages = [1, 2, 3, 4, 5]
                .map(i => cleanImageUrl(product[`Image ${i}`]))
                .filter(url => url.length > 5);

            const mImg = document.getElementById("mImg");
            const thumbs = document.getElementById("mThumbs");
            clearInterval(rotationInterval);
            thumbs.innerHTML = "";
            currentImgIdx = 0;

            mImg.src = modalImages[0] || "";

            modalImages.forEach((url, i) => {
                const t = document.createElement("img");
                t.src = url;
                t.className = "modal-thumb" + (i === 0 ? " active" : "");
                t.onclick = () => {
                    currentImgIdx = i;
                    mImg.src = url;
                    document.querySelectorAll(".modal-thumb").forEach((el, idx) => {
                        el.classList.toggle("active", idx === i);
                    });
                    clearInterval(rotationInterval);
                };
                thumbs.appendChild(t);
            });

            if (modalImages.length > 1) {
                rotationInterval = setInterval(() => {
                    currentImgIdx = (currentImgIdx + 1) % modalImages.length;
                    thumbs.children[currentImgIdx].click();
                }, 1800);
            }

            document.body.classList.add("modal-open");
            document.getElementById("productModal").style.display = "flex";
            history.pushState({ page: "product" }, "", "#product");
        }

        function closeModal() {
            document.getElementById("productModal").style.display = "none";
            document.body.classList.remove("modal-open");
            clearInterval(rotationInterval);
            window.scrollTo({ top: savedScrollPosition, behavior: "instant" });
        }

        function closeModalToHome() {
            closeModal();
            if (window.location.hash) history.back();
        }

        function goHome() {
            if (document.getElementById("productModal").style.display === "flex") {
                closeModalToHome();
                return;
            }

            document.getElementById("searchInput").value = "";
            document.getElementById("categoryFilter").value = "ALL";
            document.getElementById("sortFilter").value = "DEFAULT";
            applyFilters();
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        window.addEventListener("popstate", () => {
            if (document.getElementById("productModal").style.display === "flex") {
                closeModal();
            }
        });

        // Touch event handlers for pausing/resuming carousel
        const carouselViewport = document.getElementById("carouselViewport");

        ["touchstart", "mousedown"].forEach(evt => {
            carouselViewport.addEventListener(evt, () => {
                userTouchingCarousel = true;
                clearInterval(carouselInterval);
            }, { passive: true });
        });

        ["touchend", "mouseup", "mouseleave", "touchcancel"].forEach(evt => {
            carouselViewport.addEventListener(evt, () => {
                userTouchingCarousel = false;
                const visible = document.getElementById("carouselSection").style.display !== "none";
                const topCount = products.filter(isTopSelling).length;
                if (visible && topCount > 2) setTimeout(startInfiniteCarousel, 600);
            }, { passive: true });
        });

        let resizeTimer = null;
        window.addEventListener("resize", () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                updateCarouselMetrics();
                const section = document.getElementById("carouselSection");
                if (section && section.style.display !== "none") {
                    const viewport = document.getElementById("carouselViewport");
                    const step = getCarouselStep();
                    if (step > 0) {
                        const index = Math.round(viewport.scrollLeft / step);
                        viewport.scrollLeft = index * step;
                    }
                }
            }, 100);
        });

        window.addEventListener("load", async () => {
            initTheme();
            initNotifyUI();
            loadOneSignal();
            updateCarouselMetrics();

            try {
                const response = await fetch(CSV_URL);
                const csv = await response.text();
                const rows = parseCSV(csv);
                const headers = rows[0].map(h => h.trim());

                for (let i = 1; i < rows.length; i++) {
                    if (!rows[i].length) continue;
                    const p = {};
                    headers.forEach((h, idx) => p[h] = rows[i][idx] || "");

                    const active = String(p["Active"] || "").trim().toUpperCase();
                    if (active !== "FALSE" && active !== "0" && active !== "NO" && hasValidImages(p)) {
                        products.push(p);
                    }
                }

                document.getElementById("status").style.display = "none";
                populateCategories();
                applyFilters();
            } catch (error) {
                document.getElementById("status").innerText = "❌ Could not load collection.";
            }
        });

        window.addEventListener("beforeinstallprompt", e => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById("installBtn").style.display = "block";
        });

        function triggerInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                document.getElementById("installBtn").style.display = "none";
            } else {
                alert("Use browser menu → Add to Home Screen");
            }
        }

        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("sw.js").catch(() => {});
            });
        }
    </script>
</body>

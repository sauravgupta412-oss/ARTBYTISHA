<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewelry Finder</title>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d88fa0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Jewelry Finder">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #fdf5f6; 
            margin: 0;
            padding: 20px; 
            display: flex; 
            justify-content: center; 
        }
        .container { 
            background-color: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 500px; 
        }
        h2 { 
            text-align: center; 
            color: #d88fa0; 
            margin-top: 0;
        }
        .search-box { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 20px; 
        }
        input[type="text"] { 
            flex: 1; 
            padding: 12px; 
            border: 2px solid #ecd3d8; 
            border-radius: 6px; 
            outline: none; 
            font-size: 16px;
            text-transform: uppercase;
        }
        input[type="text"]:focus {
            border-color: #d88fa0;
        }
        button { 
            padding: 12px 20px; 
            background-color: #d88fa0; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px;
            cursor: pointer; 
        }
        button:disabled { 
            background-color: #ccc; 
        }
        #result { 
            display: none; 
            border-top: 2px dashed #eee; 
            padding-top: 20px; 
        }
        .image-gallery {
            text-align: center;
            margin-bottom: 15px;
            position: relative;
        }
        .product-image { 
            width: 100%; 
            height: 280px; 
            object-fit: contain; 
            background: #f9f9f9; 
            border-radius: 8px; 
            border: 1px solid #eee;
            margin-bottom: 10px; 
        }
        .thumbnail-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            min-height: 60px;
            flex-wrap: wrap;
        }
        .thumb {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border: 2px solid #ecd3d8;
            border-radius: 6px;
            cursor: pointer;
            background-color: #fff;
            transition: 0.2s;
        }
        .thumb:hover, .thumb.active {
            border-color: #d88fa0;
            transform: scale(1.08);
        }
        .sku-code {
            color: #888;
            font-size: 13px;
            margin: 0;
            letter-spacing: 1px;
        }
        .product-name {
            color: #333;
            font-size: 20px;
            margin: 5px 0 15px 0;
        }
        .inactive-tag {
            color: #e74c3c;
            font-size: 13px;
            font-weight: bold;
            background-color: #fcebeb;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
            vertical-align: middle;
        }
        .price-box { 
            background: #fff9fa; 
            border: 1px solid #ecd3d8;
            padding: 15px; 
            border-radius: 8px; 
            display: flex; 
            justify-content: space-around; 
            align-items: center;
            text-align: center; 
            margin-top: 15px; 
        }
        .price-box small {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
        }
        .price-box b {
            font-size: 18px;
            color: #333;
        }
        .selling { 
            font-size: 22px !important; 
            color: #27ae60 !important; 
            font-weight: bold; 
        }
        .status { 
            text-align: center; 
            color: #d88fa0; 
            font-weight: bold; 
            font-size: 14px; 
            margin-bottom: 10px; 
        }
        .error { 
            color: #e74c3c; 
            text-align: center; 
            font-weight: bold;
            display: none; 
            margin-top: 10px; 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Product Finder</h2>
    
    <div id="status" class="status">🔄 Loading Google Sheet data...</div>
    <div id="errorMsg" class="error">Article Code not found. Please try again.</div>

    <div class="search-box">
        <input type="text" id="skuInput" placeholder="Loading catalog..." onkeypress="if(event.key==='Enter')search()">
        <button id="searchBtn" onclick="search()" disabled>Search</button>
    </div>

    <div id="result">
        <div class="image-gallery" id="galleryWrapper">
            <img id="resImg" class="product-image" src="" alt="Product Image">
            <div id="thumbnailContainer" class="thumbnail-container"></div>
        </div>

        <p id="resSku" class="sku-code"></p>
        <h3 id="resName" class="product-name"></h3>
        
        <div class="price-box">
            <div><small>Purchase</small><br><b id="resP"></b></div>
            <div style="color:#ccc; font-weight:bold;">+</div>
            <div><small>Margin</small><br><b id="resM"></b></div>
            <div style="color:#ccc; font-weight:bold;">=</div>
            <div><small>Selling</small><br><b id="resS" class="selling"></b></div>
        </div>
    </div>
</div>

<script>
    const SHEET_ID = "1h9RxfOCsIBul2HuSwWUAK8LQ8nrmriMK8IG_B1TD1BQ";
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Products`;

    let database = [];
    
    // ========================================
    //   AUTO-ROTATION SETTINGS
    // ========================================
    const ROTATION_SPEED = 1500; // milliseconds (500ms = 0.5 seconds)
    let rotationInterval = null;
    let loadedImages = [];
    let currentImageIdx = 0;
    // ========================================

    const statusEl = document.getElementById('status');
    const mainImg = document.getElementById('resImg');
    const galleryWrapper = document.getElementById('galleryWrapper');

    // Convert Google Drive share links to direct image links
    function cleanImageUrl(url) {
        if (!url) return '';
        url = url.trim();
        if (url.includes('drive.google.com')) {
            let fileId = '';
            const regD = /\/d\/([a-zA-Z0-9_-]+)/;
            const regId = /[?&]id=([a-zA-Z0-9_-]+)/;
            const matchD = url.match(regD);
            const matchId = url.match(regId);
            if (matchD && matchD[1]) fileId = matchD[1];
            else if (matchId && matchId[1]) fileId = matchId[1];
            if (fileId) return `https://lh3.googleusercontent.com/d/${fileId}`;
        }
        return url; 
    }

    window.onload = async function() {
        try {
            const response = await fetch(CSV_URL);
            if (!response.ok) throw new Error("Could not fetch sheet data.");
            const text = await response.text();
            database = parseCSV(text);
            statusEl.style.display = "none";
            document.getElementById('searchBtn').disabled = false;
            document.getElementById('skuInput').disabled = false;
            document.getElementById('skuInput').placeholder = "Enter SKU Code...";
            document.getElementById('skuInput').focus();
        } catch (err) {
            console.error(err);
            statusEl.innerText = "❌ Connection Failed. Check Sheet sharing settings.";
            statusEl.style.color = "red";
        }
    };

    // Pause rotation on hover
    galleryWrapper.addEventListener('mouseenter', function() {
        if (rotationInterval) clearInterval(rotationInterval);
    });

    // Resume rotation when mouse leaves
    galleryWrapper.addEventListener('mouseleave', function() {
        if (loadedImages.length > 1) startRotation();
    });

    function parseCSV(text) {
        const lines = text.split('\n');
        if (lines.length < 2) return [];
        const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
        const rows = [];
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const values = lines[i].split(',').map(v => v.trim().replace(/^"|"$/g, ''));
            const obj = {};
            headers.forEach((h, idx) => obj[h] = values[idx] !== undefined ? values[idx] : '');
            rows.push(obj);
        }
        return rows;
    }

    // Highlights active thumbnail
    function updateActiveThumbnail() {
        const thumbs = document.querySelectorAll(".thumb");
        thumbs.forEach((t, idx) => {
            if (idx === currentImageIdx) t.classList.add("active");
            else t.classList.remove("active");
        });
    }

    // Rotate to next image
    function rotateImage() {
        if (loadedImages.length <= 1) return;
        currentImageIdx = (currentImageIdx + 1) % loadedImages.length;
        mainImg.src = loadedImages[currentImageIdx];
        updateActiveThumbnail();
    }

    // Start the rotation timer
    function startRotation() {
        if (rotationInterval) clearInterval(rotationInterval);
        if (loadedImages.length > 1) {
            rotationInterval = setInterval(rotateImage, ROTATION_SPEED);
            console.log(`✅ Rotation started with ${loadedImages.length} images at ${ROTATION_SPEED}ms interval`);
        }
    }

    // Load all images asynchronously and return a promise
    function loadImageAsync(src) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => resolve({ success: true, src: src });
            img.onerror = () => resolve({ success: false, src: src });
            img.src = src;
        });
    }

    async function search() {
        const rawInput = document.getElementById('skuInput').value;
        const input = rawInput.trim().toUpperCase().replace(/0/g, 'O');
        if (!input) return;

        const product = database.find(p => {
            const sku = (p["SKU Code"] || "").trim().toUpperCase().replace(/0/g, 'O');
            return sku === input;
        });

        const resDiv = document.getElementById('result');
        const errDiv = document.getElementById('errorMsg');

        // Reset rotation state
        if (rotationInterval) clearInterval(rotationInterval);
        rotationInterval = null;
        loadedImages = [];
        currentImageIdx = 0;

        if (!product) {
            resDiv.style.display = "none";
            errDiv.style.display = "block";
            return;
        }

        errDiv.style.display = "none";
        resDiv.style.display = "block";
        
        // SKU & Name
        document.getElementById('resSku').innerText = "SKU: " + product["SKU Code"];
        let nameHTML = product["Product Name"] || "Unnamed Product";
        const isActive = String(product["Active"]).toUpperCase().trim();
        if (isActive === "FALSE" || isActive === "0" || isActive === "NO") {
            nameHTML += `<span class="inactive-tag">Inactive</span>`;
        }
        document.getElementById('resName').innerHTML = nameHTML;

        // Prices
        document.getElementById('resP').innerText = "₹" + (product["Purchase"] || "0");
        document.getElementById('resM').innerText = "₹" + (product["Margin"] || "0");
        document.getElementById('resS').innerText = "₹" + (product["Selling"] || "0");
        
        // --- IMAGE LOADING ---
        const thumbContainer = document.getElementById('thumbnailContainer');
        thumbContainer.innerHTML = "";
        mainImg.src = 'https://via.placeholder.com/400x280?text=Loading...';

        let candidateImages = [];
        for (let i = 1; i <= 5; i++) {
            let imgUrl = product[`Image ${i}`];
            if (imgUrl && String(imgUrl).trim().length > 5) {
                candidateImages.push(cleanImageUrl(String(imgUrl)));
            }
        }
        if (candidateImages.length === 0) {
            const sku = product["SKU Code"];
            candidateImages = [
                `images/${sku}.jpg`,
                `images/${sku}_1.jpg`,
                `images/${sku}_2.jpg`,
                `images/${sku}_3.jpg`
            ];
        }

        // Remove duplicates
        candidateImages = [...new Set(candidateImages)];

        // Load all images in parallel and wait for all to complete
        const results = await Promise.all(candidateImages.map(src => loadImageAsync(src)));
        
        // Filter only successfully loaded images
        loadedImages = results.filter(r => r.success).map(r => r.src);

        if (loadedImages.length === 0) {
            mainImg.src = 'https://via.placeholder.com/400x280?text=No+Image+Found';
            return;
        }

        // Set first image
        currentImageIdx = 0;
        mainImg.src = loadedImages[0];

        // Build thumbnails
        loadedImages.forEach((src, idx) => {
            const thumb = document.createElement("img");
            thumb.src = src;
            thumb.className = "thumb";
            if (idx === 0) thumb.classList.add("active");
            
            thumb.onclick = function() {
                currentImageIdx = idx;
                mainImg.src = loadedImages[idx];
                updateActiveThumbnail();
                startRotation(); // Restart timer
            };
            
            thumbContainer.appendChild(thumb);
        });

        // Start auto-rotation if 2+ images
        if (loadedImages.length > 1) {
            startRotation();
        }
    }
</script>
<script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
            .then(() => console.log('✅ Service Worker Registered'))
            .catch(err => console.log('❌ SW Error:', err));
    }
</script>
</body>
</html>

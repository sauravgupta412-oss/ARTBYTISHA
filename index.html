<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Art By Tisha - Official Store</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212" id="themeColorMeta">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="launchericon-192x192.png">

    <style>
        :root {
            --bg-color: #fdf5f6;
            --card-bg: #ffffff;
            --text-main: #333;
            --text-muted: #888;
            --border-color: #ecd3d8;
            --primary: #d88fa0;
            --primary-dark: #c97a8d;
            --input-bg: #ffffff;
            --shadow: rgba(0,0,0,0.05);
        }

        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #f0f0f0;
            --text-muted: #aaa;
            --border-color: #333;
            --primary: #e8a0b0;
            --primary-dark: #d88fa0;
            --input-bg: #2a2a2a;
            --shadow: rgba(0,0,0,0.4);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background: var(--bg-color);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0 0 80px;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Main store area */
        .store-container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* Top Banner */
        #topBanner {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 102;
            letter-spacing: 0.5px;
            gap: 8px;
        }

        body.dark-mode #topBanner {
            background: #1e1e1e;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        #topBanner span {
            flex: 1;
            min-width: 0;
        }

        #themeToggleBtn {
            background: rgba(255,255,255,0.25);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            flex-shrink: 0;
        }

        body.dark-mode #themeToggleBtn {
            background: #2a2a2a;
            border-color: #444;
            color: var(--text-main);
        }

        /* Header */
        header {
            background: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            box-shadow: 0 4px 15px var(--shadow);
            position: sticky;
            top: 36px;
            z-index: 101;
            transition: 0.3s;
            cursor: pointer;
            user-select: none;
        }

        header:active {
            opacity: 0.85;
        }

        .header-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: contain;
            border: 2px solid var(--border-color);
            background: white;
            pointer-events: none;
        }

        .header-title {
            color: var(--primary-dark);
            margin: 8px 0 0;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
        }

        .header-tagline {
            color: var(--text-muted);
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            pointer-events: none;
        }

        /* Search / Filters */
        .controls-container {
            padding: 15px;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            text-align: center;
            background: var(--input-bg);
            color: var(--text-main);
            box-shadow: 0 4px 10px var(--shadow);
        }

        .filter-row {
            display: flex;
            gap: 10px;
        }

        .filter-select {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            outline: none;
            box-shadow: 0 2px 8px var(--shadow);
        }

        /* Sections */
        .section-header {
            padding: 15px 15px 8px;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-header .line {
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .section-header .count {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .sub-section-label {
            padding: 4px 15px 8px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Carousel */
        .carousel-viewport {
            overflow: hidden;
            width: 100%;
            touch-action: pan-y;
        }

        .carousel-track {
            display: flex;
            gap: 15px;
            padding: 0 15px 15px;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            touch-action: pan-x;
            cursor: grab;
        }

        .carousel-track::-webkit-scrollbar {
            display: none;
        }

        .carousel-track:active {
            cursor: grabbing;
        }

        .carousel-track .product-card {
            flex: 0 0 calc(50% - 7.5px);
            min-width: calc(50% - 7.5px);
            scroll-snap-align: start;
        }

        /* Product Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px;
            padding: 0 15px 10px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 15px var(--shadow);
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid var(--border-color);
        }

        .product-card:hover {
            transform: translateY(-3px);
        }

        .product-card:active {
            transform: scale(0.97);
        }

        .card-img-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: var(--bg-color);
            position: relative;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-badge,
        .discount-badge {
            position: absolute;
            color: white;
            font-weight: 800;
            z-index: 2;
        }

        .card-badge {
            top: 8px;
            left: 8px;
            background: linear-gradient(135deg, #f7a8b8, #c97a8d);
            font-size: 9px;
            padding: 4px 8px;
            border-radius: 20px;
        }

        .discount-badge {
            top: 8px;
            right: 8px;
            background: #27ae60;
            font-size: 10px;
            padding: 4px 7px;
            border-radius: 6px;
        }

        .card-img-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            color: var(--primary);
            font-size: 12px;
            font-weight: 600;
            gap: 6px;
        }

        .card-info {
            padding: 12px 10px;
            text-align: center;
        }

        .card-category {
            font-size: 10px;
            color: var(--primary);
            font-weight: 800;
            text-transform: uppercase;
            margin: 0 0 3px;
        }

        .card-title {
            font-size: 13px;
            color: var(--text-main);
            margin: 0 0 5px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-sku {
            font-size: 11px;
            color: var(--text-muted);
            margin: 0 0 6px;
            text-transform: uppercase;
        }

        .card-price-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .card-mrp {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: line-through;
            margin: 0;
        }

        .card-price {
            font-size: 16px;
            color: var(--primary-dark);
            font-weight: 800;
            margin: 0;
        }

        .card-off {
            font-size: 11px;
            color: #27ae60;
            font-weight: 700;
            margin: 2px 0 0;
        }

        .status-msg,
        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: var(--primary);
            font-weight: 600;
        }

        .no-results {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Product Modal */
        .modal {
            position: fixed;
            inset: 0;
            background: var(--card-bg);
            z-index: 1000;
            display: none;
            flex-direction: column;
            animation: slideUp 0.3s ease-out;
            overflow-y: auto;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: var(--card-bg);
            z-index: 10;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-main);
            cursor: pointer;
        }

        .modal-content {
            padding: 20px;
            padding-bottom: 100px;
        }

        .modal-gallery {
            width: 100%;
        }

        .modal-info {
            width: 100%;
        }

        .modal-img {
            display: block;
            width: 100%;
            height: min(55vh, 430px);
            object-fit: contain;
            background: var(--bg-color);
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .thumb-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .modal-thumb {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
        }

        .modal-thumb.active {
            border-color: var(--primary);
        }

        .modal-cat {
            font-size: 12px;
            color: var(--primary);
            font-weight: bold;
            text-transform: uppercase;
            margin: 0 0 5px;
        }

        .modal-title {
            font-size: 22px;
            color: var(--text-main);
            margin: 0 0 5px;
        }

        .modal-sku {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0 0 12px;
        }

        .watching-badge {
            display: none;
            align-items: center;
            gap: 6px;
            background: #fff3f5;
            border: 1px solid #f5c6ce;
            color: #c97a8d;
            font-size: 12px;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 10px;
            margin: 0 0 16px;
            line-height: 1.35;
        }

        .watching-badge.show {
            display: inline-flex;
        }

        body.dark-mode .watching-badge {
            background: #2a1f22;
            border-color: #4a3338;
            color: #e8a0b0;
        }

        .watching-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e74c3c;
            flex-shrink: 0;
            animation: pulseDot 1.2s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(0.85); }
        }

        .modal-price-box {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
        }

        .modal-mrp-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        .modal-mrp {
            font-size: 16px;
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .modal-discount-pill {
            background: #e8f8ef;
            color: #27ae60;
            font-size: 12px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
        }

        body.dark-mode .modal-discount-pill {
            background: #1a2e22;
        }

        .modal-price {
            font-size: 28px;
            color: var(--primary-dark);
            font-weight: 900;
            margin: 0;
        }

        .whatsapp-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: #25D366;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
            text-decoration: none;
            z-index: 1001;
        }

        #installBtn {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(216,143,160,0.45);
            cursor: pointer;
            display: none;
            white-space: nowrap;
        }

        /* ===============================
           DESKTOP / TABLET OPTIMIZATION
           =============================== */
        @media (min-width: 768px) {
            body {
                padding-bottom: 30px;
            }

            .controls-container {
                max-width: 1200px;
                margin: 0 auto;
                flex-direction: row;
                align-items: center;
            }

            .search-input {
                flex: 2;
            }

            .filter-row {
                flex: 1;
            }

            .grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 20px;
                padding: 0 20px 20px;
            }

            .section-header {
                padding-left: 20px;
                padding-right: 20px;
            }

            .carousel-track {
                padding-left: 20px;
                padding-right: 20px;
            }

            .carousel-track .product-card {
                flex: 0 0 calc(25% - 15px);
                min-width: calc(25% - 15px);
            }

            .modal-content {
                display: grid;
                grid-template-columns: minmax(350px, 1fr) minmax(320px, 0.8fr);
                gap: 45px;
                width: 100%;
                max-width: 1200px;
                margin: 0 auto;
                padding: 40px;
                align-items: start;
            }

            .modal-gallery {
                position: sticky;
                top: 85px;
            }

            .modal-img {
                height: min(70vh, 600px);
                margin-bottom: 15px;
                border: 1px solid var(--border-color);
                background: var(--bg-color);
            }

            .modal-title {
                font-size: 28px;
            }

            .modal-info {
                padding-top: 20px;
            }

            .whatsapp-btn {
                position: relative;
                left: auto;
                bottom: auto;
                transform: none;
                width: 100%;
                max-width: none;
                margin-top: 25px;
                padding: 17px;
            }
        }

        @media (min-width: 1100px) {
            .grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }
    </style>
</head>

    <script>
        const WHATSAPP_NUMBER = "918287567099";
        const SHEET_ID = "1h9RxfOCsIBul2HuSwWUAK8LQ8nrmriMK8IG_B1TD1BQ";
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Products`;

        const CATEGORY_ORDER = [
            "NECKLACE", "NECKLACES",
            "BANGLES", "BANGLE",
            "EARRINGS", "EARRING",
            "BRACELETS", "BRACELET",
            "RINGS", "RING"
        ];

        const VISIT_COUNT_CACHE = "abt_global_visits_v10";
        const WATCH_TTL_MS = 10 * 60 * 1000;
        const BASE_START_COUNT = 1482;

        let products = [];
        let modalImages = [];
        let currentImgIdx = 0;
        let rotationInterval = null;
        let carouselInterval = null;
        let userTouchingCarousel = false;
        let modalOpen = false;
        let deferredPrompt = null;

        const ROTATION_SPEED = 1500;
        const CAROUSEL_SPEED = 2500;

        /* CSV parser: supports commas inside quoted fields */
        function parseCSV(text) {
            const rows = [];
            let row = [];
            let value = "";
            let insideQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (char === '"' && insideQuotes && nextChar === '"') {
                    value += '"';
                    i++;
                } else if (char === '"') {
                    insideQuotes = !insideQuotes;
                } else if (char === "," && !insideQuotes) {
                    row.push(value.trim());
                    value = "";
                } else if ((char === "\n" || char === "\r") && !insideQuotes) {
                    if (char === "\r" && nextChar === "\n") i++;
                    row.push(value.trim());

                    if (row.some(cell => cell !== "")) {
                        rows.push(row);
                    }

                    row = [];
                    value = "";
                } else {
                    value += char;
                }
            }

            if (value || row.length) {
                row.push(value.trim());
                rows.push(row);
            }

            return rows;
        }

        function initTheme() {
            const saved = localStorage.getItem("tisha_theme");
            const useDark = saved !== "light";

            document.body.classList.toggle("dark-mode", useDark);
            document.getElementById("themeToggleBtn").innerText = useDark ? "☀️ Light" : "🌙 Dark";

            document.getElementById("themeColorMeta").setAttribute(
                "content",
                useDark ? "#121212" : "#ffffff"
            );

            if (!saved) localStorage.setItem("tisha_theme", "dark");
        }

        function toggleTheme() {
            document.body.classList.toggle("dark-mode");

            const isDark = document.body.classList.contains("dark-mode");

            localStorage.setItem("tisha_theme", isDark ? "dark" : "light");
            document.getElementById("themeToggleBtn").innerText = isDark ? "☀️ Light" : "🌙 Dark";

            document.getElementById("themeColorMeta").setAttribute(
                "content",
                isDark ? "#121212" : "#ffffff"
            );
        }

        function initVisitorCounter() {
            const visitEl = document.getElementById("visitNumber");

            let cached = parseInt(localStorage.getItem(VISIT_COUNT_CACHE) || "0", 10);
            if (cached < BASE_START_COUNT) cached = BASE_START_COUNT;

            visitEl.innerText = cached.toLocaleString("en-IN");

            const activeSession = sessionStorage.getItem("abt_active_session");
            const shouldIncrement = !activeSession;

            if (shouldIncrement) {
                sessionStorage.setItem("abt_active_session", "true");
            }

            syncGlobalCounter(shouldIncrement, cached);
        }

        async function syncGlobalCounter(shouldIncrement, cachedCount) {
            const visitEl = document.getElementById("visitNumber");
            const apiKey = "artbytisha_store_catalog_v10";

            const url = shouldIncrement
                ? `https://api.counterapi.dev/v1/${apiKey}/visits/up`
                : `https://api.counterapi.dev/v1/${apiKey}/visits`;

            try {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 2500);

                const response = await fetch(url, {
                    signal: controller.signal,
                    cache: "no-store"
                });

                clearTimeout(timer);

                if (!response.ok) throw new Error("Counter failed");

                const data = await response.json();
                let count = data.count ?? data.value ?? data.hits;

                if (count && !isNaN(count)) {
                    if (count < BASE_START_COUNT) count += BASE_START_COUNT;

                    visitEl.innerText = Number(count).toLocaleString("en-IN");
                    localStorage.setItem(VISIT_COUNT_CACHE, String(count));
                }
            } catch (error) {
                if (shouldIncrement) {
                    cachedCount += 1;
                    visitEl.innerText = cachedCount.toLocaleString("en-IN");
                    localStorage.setItem(VISIT_COUNT_CACHE, String(cachedCount));
                }
            }
        }

        function calcPricing(sellingValue) {
            const selling = parseFloat(sellingValue) || 0;
            const mrp = Math.round(selling * 1.6);
            const discount = mrp > 0
                ? Math.round(((mrp - selling) / mrp) * 100)
                : 0;

            return {
                selling,
                mrp,
                discount,
                sellingText: "₹" + selling,
                mrpText: "₹" + mrp,
                discountText: discount + "% OFF"
            };
        }

        function cleanImageUrl(url) {
            if (!url) return "";

            url = String(url).trim();

            if (url.includes("drive.google.com")) {
                const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                const idMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                const fileId = driveMatch?.[1] || idMatch?.[1];

                if (fileId) {
                    return `https://lh3.googleusercontent.com/d/${fileId}`;
                }
            }

            return url;
        }

        function hasValidImages(product) {
            for (let i = 1; i <= 5; i++) {
                if (product[`Image ${i}`] && String(product[`Image ${i}`]).trim().length > 5) {
                    return true;
                }
            }
            return false;
        }

        function isTopSelling(product) {
            return (product["Category"] || "").trim().toUpperCase() === "TOP SELLING";
        }

        function sortList(list, filter) {
            const sorted = [...list];

            if (filter === "PRICE_ASC") {
                sorted.sort((a, b) => (parseFloat(a["Selling"]) || 0) - (parseFloat(b["Selling"]) || 0));
            } else if (filter === "PRICE_DESC") {
                sorted.sort((a, b) => (parseFloat(b["Selling"]) || 0) - (parseFloat(a["Selling"]) || 0));
            } else if (filter === "NAME_ASC") {
                sorted.sort((a, b) =>
                    (a["Product Name"] || "").localeCompare(b["Product Name"] || "")
                );
            }

            return sorted;
        }

        function sortImagesFirst(list, filter) {
            const withImages = list.filter(hasValidImages);
            const withoutImages = list.filter(product => !hasValidImages(product));

            return [
                ...sortList(withImages, filter),
                ...sortList(withoutImages, filter)
            ];
        }

        function sortCategories(categories) {
            return categories.sort((a, b) => {
                const aIndex = CATEGORY_ORDER.indexOf(a.toUpperCase());
                const bIndex = CATEGORY_ORDER.indexOf(b.toUpperCase());

                if (aIndex !== -1 && bIndex !== -1) return aIndex - bIndex;
                if (aIndex !== -1) return -1;
                if (bIndex !== -1) return 1;

                return a.localeCompare(b);
            });
        }

        function populateCategories() {
            const select = document.getElementById("categoryFilter");
            const categories = new Set();

            products.forEach(product => {
                const category = (product["Category"] || "").trim();

                if (category && category.toUpperCase() !== "TOP SELLING") {
                    categories.add(category);
                }
            });

            sortCategories([...categories]).forEach(category => {
                const option = document.createElement("option");
                option.value = category.toUpperCase();
                option.textContent = category;
                select.appendChild(option);
            });
        }

        function createCard(item, badgeEmoji) {
            const pricing = calcPricing(item["Selling"]);
            const name = item["Product Name"] || "Jewelry";
            const sku = item["SKU Code"] || "";
            const category = (item["Category"] || "").trim();
            const topSelling = isTopSelling(item);

            const card = document.createElement("div");
            card.className = "product-card";
            card.onclick = () => openModal(sku);

            const imageUrl = cleanImageUrl(item["Image 1"]);

            const imageSection = hasValidImages(item) && imageUrl
                ? `<img src="${imageUrl}" class="card-img" loading="lazy" alt="${name}">`
                : `<div class="card-img-placeholder"><div>💍</div><span>Coming Soon</span></div>`;

            card.innerHTML = `
                <div class="card-img-wrapper">
                    ${topSelling ? `<div class="card-badge">${badgeEmoji} Top Selling</div>` : ""}
                    ${pricing.discount > 0 ? `<div class="discount-badge">${pricing.discountText}</div>` : ""}
                    ${imageSection}
                </div>

                <div class="card-info">
                    ${category ? `<p class="card-category">${category}</p>` : ""}
                    <p class="card-title">${name}</p>
                    <p class="card-sku">SKU: ${sku}</p>

                    <div class="card-price-row">
                        <p class="card-mrp">${pricing.mrpText}</p>
                        <p class="card-price">${pricing.sellingText}</p>
                        <p class="card-off">${pricing.discountText}</p>
                    </div>
                </div>
            `;

            return card;
        }

        function renderSection(container, icon, title, items, badgeEmoji, clearFirst) {
            if (clearFirst) container.innerHTML = "";

            if (!items.length) {
                if (clearFirst) {
                    container.innerHTML = `<div class="no-results">No items found.</div>`;
                }
                return;
            }

            const header = document.createElement("div");
            header.className = "section-header";
            header.innerHTML = `${icon} ${title} <span class="count">(${items.length})</span><span class="line"></span>`;

            const grid = document.createElement("div");
            grid.className = "grid";

            items.forEach(item => grid.appendChild(createCard(item, badgeEmoji)));

            container.appendChild(header);
            container.appendChild(grid);
        }

        function renderCategoryWithSubgroups(container, categoryName, items, clearFirst) {
            if (clearFirst) container.innerHTML = "";

            if (!items.length) {
                if (clearFirst) {
                    container.innerHTML = `<div class="no-results">No items found.</div>`;
                }
                return;
            }

            renderSection(container, "📂", categoryName, items, "✨", false);
        }

        function renderGroupedSections(data, sortFilter) {
            const grid = document.getElementById("productGrid");
            grid.innerHTML = "";

            if (!data.length) {
                grid.innerHTML = `<div class="no-results">No items found.</div>`;
                return;
            }

            const groups = {};
            const uncategorized = [];

            data.forEach(product => {
                const category = (product["Category"] || "").trim();

                if (category) {
                    if (!groups[category]) groups[category] = [];
                    groups[category].push(product);
                } else {
                    uncategorized.push(product);
                }
            });

            sortCategories(Object.keys(groups)).forEach(category => {
                renderSection(
                    grid,
                    "📂",
                    category,
                    sortImagesFirst(groups[category], sortFilter),
                    "✨",
                    false
                );
            });

            if (uncategorized.length) {
                renderSection(
                    grid,
                    "📂",
                    "Uncategorized",
                    sortImagesFirst(uncategorized, sortFilter),
                    "✨",
                    false
                );
            }
        }

        function renderCarousel() {
            const topItems = products.filter(isTopSelling);
            const section = document.getElementById("carouselSection");
            const track = document.getElementById("carouselTrack");

            clearInterval(carouselInterval);
            track.innerHTML = "";

            if (!topItems.length) {
                section.style.display = "none";
                return;
            }

            section.style.display = "block";

            const ordered = sortImagesFirst(topItems, "DEFAULT");

            ordered.forEach(item => {
                track.appendChild(createCard(item, "⭐"));
            });

            if (ordered.length > 2) {
                ordered.forEach(item => {
                    track.appendChild(createCard(item, "⭐"));
                });

                track.scrollLeft = 0;
                startInfiniteCarousel();
            }
        }

        function hideCarousel() {
            document.getElementById("carouselSection").style.display = "none";
            clearInterval(carouselInterval);
        }

        function startInfiniteCarousel() {
            const track = document.getElementById("carouselTrack");

            clearInterval(carouselInterval);

            carouselInterval = setInterval(() => {
                if (userTouchingCarousel || track.children.length < 3) return;

                const firstCard = track.children[0];
                const step = firstCard.offsetWidth + 15;
                const maxScroll = track.scrollWidth - track.clientWidth;

                if (track.scrollLeft + step >= maxScroll - 5) {
                    track.style.scrollBehavior = "auto";
                    track.scrollLeft = 0;
                    track.style.scrollBehavior = "smooth";
                }

                track.scrollBy({
                    left: step,
                    behavior: "smooth"
                });
            }, CAROUSEL_SPEED);
        }

        function applyFiltersAndSort() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            const categoryFilter = document.getElementById("categoryFilter").value;
            const sortFilter = document.getElementById("sortFilter").value;

            if (!query && categoryFilter === "ALL") {
                renderCarousel();
            } else {
                hideCarousel();
            }

            const filtered = products.filter(product => {
                const name = (product["Product Name"] || "").toLowerCase();
                const sku = (product["SKU Code"] || "").toLowerCase();
                const category = (product["Category"] || "").trim().toUpperCase();

                const matchesSearch = !query || name.includes(query) || sku.includes(query);

                let matchesCategory = true;

                if (categoryFilter === "TOP_SELLING") {
                    matchesCategory = category === "TOP SELLING";
                } else if (categoryFilter === "NO_CATEGORY") {
                    matchesCategory = category === "";
                } else if (categoryFilter !== "ALL") {
                    matchesCategory = category === categoryFilter;
                }

                return matchesSearch && matchesCategory;
            });

            const productGrid = document.getElementById("productGrid");

            if (categoryFilter === "ALL") {
                const nonTopSelling = query
                    ? filtered
                    : filtered.filter(product => !isTopSelling(product));

                renderGroupedSections(nonTopSelling, sortFilter);
            } else if (categoryFilter === "TOP_SELLING") {
                renderSection(
                    productGrid,
                    "🔥",
                    "Top Selling",
                    sortImagesFirst(filtered, sortFilter),
                    "⭐",
                    true
                );
            } else if (categoryFilter === "NO_CATEGORY") {
                renderSection(
                    productGrid,
                    "📂",
                    "Uncategorized",
                    sortImagesFirst(filtered, sortFilter),
                    "✨",
                    true
                );
            } else {
                renderSection(
                    productGrid,
                    "📂",
                    categoryFilter,
                    sortImagesFirst(filtered, sortFilter),
                    "✨",
                    true
                );
            }
        }

        function getWatchingCount(sku) {
            const key = "abt_watch_top_" + String(sku || "unknown");
            const now = Date.now();

            try {
                const saved = JSON.parse(localStorage.getItem(key));

                if (saved && saved.n && saved.t && (now - saved.t) < WATCH_TTL_MS) {
                    return saved.n;
                }
            } catch (error) {}

            const count = Math.floor(Math.random() * 4) + 2;

            localStorage.setItem(key, JSON.stringify({
                n: count,
                t: now
            }));

            return count;
        }

        function updateWatchingBadge(product) {
            const badge = document.getElementById("watchingBadge");
            const text = document.getElementById("watchingText");

            if (!product || !isTopSelling(product)) {
                badge.classList.remove("show");
                return;
            }

            const count = getWatchingCount(product["SKU Code"]);

            text.innerText = `${count} customers are watching this design currently`;
            badge.classList.add("show");
        }

        function openModal(sku) {
            const product = products.find(item => item["SKU Code"] === sku);
            if (!product) return;

            const pricing = calcPricing(product["Selling"]);

            document.getElementById("mTitle").innerText = product["Product Name"] || "Jewelry";
            document.getElementById("mSku").innerText = "SKU: " + sku;
            document.getElementById("mCat").innerText = product["Category"] || "";
            document.getElementById("mMrp").innerText = pricing.mrpText;
            document.getElementById("mDiscount").innerText = pricing.discountText;
            document.getElementById("mPrice").innerText = pricing.sellingText;

            updateWatchingBadge(product);

            document.getElementById("mWhatsapp").href =
                `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(
                    `Hi, I am interested in:\n` +
                    `*${product["Product Name"]}*\n` +
                    `*SKU:* ${sku}\n` +
                    `*MRP:* ${pricing.mrpText}\n` +
                    `*Offer:* ${pricing.sellingText} (${pricing.discountText})`
                )}`;

            const mainImage = document.getElementById("mImg");
            const thumbs = document.getElementById("mThumbs");

            clearInterval(rotationInterval);

            modalImages = [];
            currentImgIdx = 0;
            thumbs.innerHTML = "";

            ["Image 1", "Image 2", "Image 3", "Image 4", "Image 5"].forEach(key => {
                const imageUrl = cleanImageUrl(product[key]);

                if (imageUrl && imageUrl.length > 5) {
                    modalImages.push(imageUrl);
                }
            });

            modalImages = [...new Set(modalImages)];

            if (!modalImages.length) {
                mainImage.src = "https://via.placeholder.com/700x700?text=No+Image";
            } else {
                mainImage.src = modalImages[0];

                modalImages.forEach((imageUrl, index) => {
                    const thumb = document.createElement("img");
                    thumb.src = imageUrl;
                    thumb.className = "modal-thumb" + (index === 0 ? " active" : "");
                    thumb.alt = `Product image ${index + 1}`;

                    thumb.onclick = () => {
                        currentImgIdx = index;
                        mainImage.src = imageUrl;
                        updateModalThumbs();
                        startModalRotation();
                    };

                    thumbs.appendChild(thumb);
                });

                if (modalImages.length > 1) {
                    startModalRotation();
                }
            }

            document.body.style.overflow = "hidden";
            document.getElementById("productModal").style.display = "flex";

            modalOpen = true;
            history.pushState({ page: "product", sku }, "", location.pathname + "#product");
        }

        function updateModalThumbs() {
            document.querySelectorAll(".modal-thumb").forEach((thumb, index) => {
                thumb.classList.toggle("active", index === currentImgIdx);
            });
        }

        function startModalRotation() {
            clearInterval(rotationInterval);

            if (modalImages.length < 2) return;

            rotationInterval = setInterval(() => {
                currentImgIdx = (currentImgIdx + 1) % modalImages.length;
                document.getElementById("mImg").src = modalImages[currentImgIdx];
                updateModalThumbs();
            }, ROTATION_SPEED);
        }

        function closeModal() {
            document.getElementById("productModal").style.display = "none";
            document.body.style.overflow = "auto";
            clearInterval(rotationInterval);
            modalOpen = false;
        }

        function closeModalToHome() {
            closeModal();

            document.getElementById("searchInput").value = "";
            document.getElementById("categoryFilter").value = "ALL";
            document.getElementById("sortFilter").value = "DEFAULT";

            applyFiltersAndSort();
            window.scrollTo({ top: 0, behavior: "smooth" });

            history.replaceState({ page: "home" }, "", location.pathname);
        }

        function goHome() {
            if (document.getElementById("productModal").style.display === "flex") {
                closeModalToHome();
                return;
            }

            document.getElementById("searchInput").value = "";
            document.getElementById("categoryFilter").value = "ALL";
            document.getElementById("sortFilter").value = "DEFAULT";

            applyFiltersAndSort();
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        const carouselTrack = document.getElementById("carouselTrack");

        carouselTrack.addEventListener("touchstart", () => {
            userTouchingCarousel = true;
            clearInterval(carouselInterval);
        }, { passive: true });

        carouselTrack.addEventListener("touchend", () => {
            userTouchingCarousel = false;

            setTimeout(() => {
                if (!document.getElementById("searchInput").value) {
                    startInfiniteCarousel();
                }
            }, 700);
        }, { passive: true });

        window.addEventListener("popstate", () => {
            const modal = document.getElementById("productModal");

            if (modal.style.display === "flex") {
                closeModal();
                window.scrollTo({ top: 0, behavior: "smooth" });
            }
        });

        window.addEventListener("beforeinstallprompt", event => {
            event.preventDefault();
            deferredPrompt = event;
            document.getElementById("installBtn").style.display = "block";
        });

        function triggerInstall() {
            if (!deferredPrompt) {
                alert("Tap browser menu (⋮) → Add to Home Screen");
                return;
            }

            document.getElementById("installBtn").style.display = "none";
            deferredPrompt.prompt();
            deferredPrompt = null;
        }

        window.addEventListener("load", async () => {
            history.replaceState({ page: "home" }, "", location.pathname);

            initTheme();
            initVisitorCounter();

            const status = document.getElementById("status");

            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error("Unable to load Google Sheet");

                const csv = await response.text();
                const rows = parseCSV(csv);

                const headers = rows[0].map(header => header.trim());

                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];

                    if (!row.length) continue;

                    const product = {};

                    headers.forEach((header, index) => {
                        product[header] = row[index] || "";
                    });

                    const active = String(product["Active"] || "").trim().toUpperCase();

                    if (active !== "FALSE" && active !== "0" && active !== "NO") {
                        products.push(product);
                    }
                }

                status.style.display = "none";

                populateCategories();
                applyFiltersAndSort();

            } catch (error) {
                console.error(error);
                status.innerText = "❌ Could not load collection. Please try again later.";
            }
        });
    </script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("sw.js")
                    .then(registration => registration.update())
                    .catch(error => console.log("Service Worker Error:", error));
            });
        }
    </script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Art By Tisha - Official Store</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="launchericon-192x192.png">

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #fdf5f6; 
            margin: 0;
            padding: 0; 
            padding-bottom: 30px;
        }

        /* HEADER */
        header {
            background: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(216, 143, 160, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: contain;
            border: 2px solid #ecd3d8;
        }
        .header-title {
            color: #c97a8d;
            margin: 8px 0 0 0;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header-tagline {
            color: #b0a0a5;
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* SEARCH & FILTERS */
        .controls-container {
            padding: 15px;
            background: #fdf5f6;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .search-input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ecd3d8;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(216, 143, 160, 0.08);
            transition: 0.3s;
        }
        .search-input:focus {
            border-color: #d88fa0;
            box-shadow: 0 4px 15px rgba(216, 143, 160, 0.2);
        }
        .filter-row {
            display: flex;
            gap: 10px;
        }
        .filter-select {
            flex: 1;
            padding: 12px;
            border: 1px solid #ecd3d8;
            border-radius: 12px;
            background: white;
            color: #555;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            box-shadow: 0 2px 8px rgba(216, 143, 160, 0.05);
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23d88fa0%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 12px top 50%;
            background-size: 10px auto;
        }

        /* SECTION HEADERS */
        .section-header {
            padding: 15px 15px 8px 15px;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #c97a8d;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-header .line {
            flex: 1;
            height: 1px;
            background: #ecd3d8;
        }
        .section-header .count {
            font-size: 11px;
            color: #b0a0a5;
            font-weight: 600;
        }

        /* GRID LAYOUT */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 0 15px 5px 15px;
        }
        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .product-card:active {
            transform: scale(0.97);
        }
        .card-img-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #fff9fa;
            position: relative;
        }
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: linear-gradient(135deg, #f7a8b8, #c97a8d);
            color: white;
            font-size: 9px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(201, 122, 141, 0.4);
        }
        .card-img-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f9f3f5;
            color: #d88fa0;
            font-size: 12px;
            font-weight: 600;
            gap: 6px;
        }
        .card-img-placeholder .icon {
            font-size: 30px;
            opacity: 0.5;
        }
        .card-info {
            padding: 12px;
            text-align: center;
        }
        .card-category {
            font-size: 10px;
            color: #d88fa0;
            font-weight: 800;
            text-transform: uppercase;
            margin: 0 0 3px 0;
            letter-spacing: 0.5px;
        }
        .card-title {
            font-size: 13px;
            color: #333;
            margin: 0 0 5px 0;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-sku {
            font-size: 11px;
            color: #999;
            margin: 0 0 5px 0;
            text-transform: uppercase;
        }
        .card-price {
            font-size: 16px;
            color: #c97a8d;
            font-weight: 800;
            margin: 0;
        }

        /* LOADING */
        .status-msg {
            text-align: center;
            color: #d88fa0;
            padding: 40px 20px;
            font-weight: 600;
        }

        /* NO RESULTS */
        .no-results {
            text-align: center;
            padding: 30px 15px;
            color: #999;
            font-size: 14px;
        }

        /* FULL SCREEN MODAL */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 1000;
            display: none;
            flex-direction: column;
            animation: slideUp 0.3s ease-out;
            overflow-y: auto;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
        }
        .back-btn {
            background: none; border: none; font-size: 24px; color: #333; cursor: pointer;
        }
        
        .modal-content {
            padding: 20px;
            padding-bottom: 100px;
        }
        .modal-img {
            width: 100%;
            height: 350px;
            object-fit: contain;
            background: #fff9fa;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .thumb-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .modal-thumb {
            width: 50px; height: 50px; object-fit: cover;
            border: 2px solid #eee; border-radius: 8px;
        }
        .modal-thumb.active { border-color: #d88fa0; }
        
        .modal-cat { font-size: 12px; color: #d88fa0; font-weight: bold; text-transform: uppercase; margin: 0 0 5px 0; }
        .modal-title { font-size: 22px; color: #333; margin: 0 0 5px 0; }
        .modal-sku { font-size: 13px; color: #888; margin: 0 0 15px 0; }
        .modal-price { font-size: 26px; color: #c97a8d; font-weight: 900; margin: 0 0 20px 0; }
        
        /* WHATSAPP BUTTON */
        .whatsapp-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: #25D366;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
            text-decoration: none;
            z-index: 1001;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <img src="logo.png" alt="Logo" class="header-logo" onerror="this.style.display='none'">
        <h1 class="header-title">Art By Tisha</h1>
        <div class="header-tagline">Official Collection</div>
    </header>

    <!-- SEARCH & FILTERS -->
    <div class="controls-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Search Collection..." oninput="applyFiltersAndSort()">
        
        <div class="filter-row">
            <select id="categoryFilter" class="filter-select" onchange="applyFiltersAndSort()">
                <option value="ALL">All Categories</option>
                <option value="TOP_SELLING">🔥 Top Selling</option>
                <option value="NO_CATEGORY">📂 Uncategorized</option>
            </select>
            
            <select id="sortFilter" class="filter-select" onchange="applyFiltersAndSort()">
                <option value="DEFAULT">Default Order</option>
                <option value="PRICE_ASC">Price: Low → High</option>
                <option value="PRICE_DESC">Price: High → Low</option>
                <option value="NAME_ASC">Name: A → Z</option>
            </select>
        </div>
    </div>

    <!-- STATUS -->
    <div id="status" class="status-msg">✨ Loading Collection...</div>

    <!-- PRODUCT GRID (Dynamically rendered in sections) -->
    <div id="productGrid"></div>

    <!-- PRODUCT MODAL -->
    <div id="productModal" class="modal">
        <div class="modal-header">
            <button class="back-btn" onclick="closeModal()">✕</button>
            <h3 style="margin:0; font-size:16px; color:#333;">Details</h3>
            <div style="width:24px;"></div>
        </div>
        <div class="modal-content">
            <img id="mImg" class="modal-img" src="" alt="Product">
            <div id="mThumbs" class="thumb-row"></div>
            <p id="mCat" class="modal-cat"></p>
            <h2 id="mTitle" class="modal-title"></h2>
            <p id="mSku" class="modal-sku"></p>
            <p id="mPrice" class="modal-price"></p>
        </div>
        <a id="mWhatsapp" href="#" class="whatsapp-btn" target="_blank">
            💬 Inquire on WhatsApp
        </a>
    </div>

<script>
    // ===== APP CONFIG =====
    const WHATSAPP_NUMBER = "918287567099";
    const SHEET_ID = "1h9RxfOCsIBul2HuSwWUAK8LQ8nrmriMK8IG_B1TD1BQ";
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Products`;

    let products = [];
    const ROTATION_SPEED = 1500;
    let rotationInterval = null;
    let modalImages = [];
    let currentImgIdx = 0;

    // ===== HELPERS =====
    function cleanImageUrl(url) {
        if (!url) return '';
        url = url.trim();
        if (url.includes('drive.google.com')) {
            let fileId = '';
            const regD = /\/d\/([a-zA-Z0-9_-]+)/;
            const regId = /[?&]id=([a-zA-Z0-9_-]+)/;
            const mD = url.match(regD);
            const mId = url.match(regId);
            if (mD && mD[1]) fileId = mD[1];
            else if (mId && mId[1]) fileId = mId[1];
            if (fileId) return `https://lh3.googleusercontent.com/d/${fileId}`;
        }
        return url;
    }

    function hasValidImages(product) {
        for (let i = 1; i <= 5; i++) {
            const url = product[`Image ${i}`];
            if (url && String(url).trim().length > 5) return true;
        }
        return false;
    }

    function hasCategory(product) {
        const cat = (product["Category"] || "").trim();
        return cat.length > 0;
    }

    function isTopSelling(product) {
        return (product["Category"] || "").trim().toUpperCase() === "TOP SELLING";
    }

    // ===== PRIORITY CLASSIFICATION =====
    // Priority 1 = Top Selling
    // Priority 2 = Other Categories (not Top Selling, has category)
    // Priority 3 = No Category but has images
    // Priority 4 = No Category and no images
    function getPriority(product) {
        if (isTopSelling(product)) return 1;
        if (hasCategory(product)) return 2;
        if (hasValidImages(product)) return 3;
        return 4;
    }

    function getPriorityLabel(priority) {
        switch (priority) {
            case 1: return { icon: "🔥", title: "Top Selling", emoji: "⭐" };
            case 2: return { icon: "📂", title: "Other Categories", emoji: "✨" };
            case 3: return { icon: "🖼️", title: "Available Designs", emoji: "💎" };
            case 4: return { icon: "📋", title: "More Coming Soon", emoji: "🕐" };
        }
    }

    // ===== INITIALIZE =====
    window.onload = async function() {
        const statusEl = document.getElementById('status');
        try {
            const res = await fetch(CSV_URL);
            if (!res.ok) throw new Error();
            const text = await res.text();
            
            const lines = text.split('\n');
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const values = lines[i].split(',').map(v => v.trim().replace(/^"|"$/g, ''));
                const obj = {};
                headers.forEach((h, idx) => obj[h] = values[idx] !== undefined ? values[idx] : '');
                
                // Only push active products
                const isActive = String(obj["Active"]).toUpperCase().trim();
                if (isActive !== "FALSE" && isActive !== "0" && isActive !== "NO") {
                    // Assign a sort priority number to each product
                    obj._priority = getPriority(obj);
                    products.push(obj);
                }
            }

            statusEl.style.display = 'none';
            applyFiltersAndSort();

        } catch (err) {
            statusEl.innerText = "❌ Could not load collection. Please try again later.";
        }
    };

    // ===== MAIN FILTER + SORT + GROUP ENGINE =====
    function applyFiltersAndSort() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const catFilter = document.getElementById('categoryFilter').value;
        const sortFilter = document.getElementById('sortFilter').value;

        // STEP 1: FILTER
        let filtered = products.filter(p => {
            const name = (p["Product Name"] || "").toLowerCase();
            const sku = (p["SKU Code"] || "").toLowerCase();
            const cat = (p["Category"] || "").trim().toUpperCase();

            const matchesSearch = !query || name.includes(query) || sku.includes(query);
            let matchesCat = true;

            switch (catFilter) {
                case "ALL":
                    matchesCat = true;
                    break;
                case "TOP_SELLING":
                    matchesCat = cat === "TOP SELLING";
                    break;
                case "NO_CATEGORY":
                    matchesCat = cat.length === 0;
                    break;
                default:
                    matchesCat = cat === catFilter;
            }

            return matchesSearch && matchesCat;
        });

        // STEP 2: APPLY USER SORT WITHIN the filtered set
        if (sortFilter === "PRICE_ASC") {
            filtered.sort((a, b) => (parseFloat(a["Selling"]) || 0) - (parseFloat(b["Selling"]) || 0));
        } else if (sortFilter === "PRICE_DESC") {
            filtered.sort((a, b) => (parseFloat(b["Selling"]) || 0) - (parseFloat(a["Selling"]) || 0));
        } else if (sortFilter === "NAME_ASC") {
            filtered.sort((a, b) => (a["Product Name"] || "").localeCompare(b["Product Name"] || ""));
        }

        // STEP 3: GROUP BY PRIORITY SECTIONS
        // Re-assign priority after sorting
        filtered.forEach(p => p._priority = getPriority(p));

        if (catFilter === "ALL") {
            // Show 4 distinct sections
            renderGroupedSections(filtered);
        } else if (catFilter === "TOP_SELLING") {
            renderFlatGrid(filtered, "🔥 Top Selling");
        } else if (catFilter === "NO_CATEGORY") {
            renderFlatGrid(filtered, "📂 Uncategorized");
        } else {
            renderFlatGrid(filtered, catFilter);
        }
    }

    // ===== RENDER: GROUPED BY PRIORITY SECTIONS =====
    function renderGroupedSections(data) {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = "";

        if (data.length === 0) {
            grid.innerHTML = "<div class='no-results'>No items found matching your search.</div>";
            return;
        }

        // Group by priority
        const groups = { 1: [], 2: [], 3: [], 4: [] };
        data.forEach(p => {
            const pr = p._priority || 4;
            groups[pr].push(p);
        });

        // Render each non-empty group
        [1, 2, 3, 4].forEach(priority => {
            const items = groups[priority];
            if (items.length === 0) return;

            const label = getPriorityLabel(priority);

            // Section Header
            const header = document.createElement('div');
            header.className = "section-header";
            header.innerHTML = `${label.icon} ${label.title} <span class="count">(${items.length})</span> <span class="line"></span>`;
            grid.appendChild(header);

            // Grid of cards
            const gridEl = document.createElement('div');
            gridEl.className = "grid";
            items.forEach(item => gridEl.appendChild(createCard(item, label.emoji)));
            grid.appendChild(gridEl);
        });
    }

    // ===== RENDER: FLAT GRID (when filtering by specific category) =====
    function renderFlatGrid(data, title) {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = "";

        if (data.length === 0) {
            grid.innerHTML = "<div class='no-results'>No items found matching your search.</div>";
            return;
        }

        const header = document.createElement('div');
        header.className = "section-header";
        header.innerHTML = `${title} <span class="count">(${data.length})</span> <span class="line"></span>`;
        grid.appendChild(header);

        const gridEl = document.createElement('div');
        gridEl.className = "grid";
        data.forEach(item => gridEl.appendChild(createCard(item, "✨")));
        grid.appendChild(gridEl);
    }

    // ===== CREATE PRODUCT CARD =====
    function createCard(item, badgeEmoji) {
        const price = item["Selling"] || "0";
        const name = item["Product Name"] || "Jewelry";
        const sku = item["SKU Code"] || "";
        const cat = (item["Category"] || "").trim();
        const priority = item._priority || 4;

        const card = document.createElement('div');
        card.className = "product-card";
        card.onclick = () => openModal(sku);

        let imgSection = '';
        let imgSrc = '';

        // Check if product has valid images
        if (hasValidImages(item)) {
            imgSrc = cleanImageUrl(item["Image 1"]) || '';
            if (imgSrc) {
                imgSection = `<img src="${imgSrc}" class="card-img" loading="lazy">`;
            } else {
                imgSection = `
                    <div class="card-img-placeholder">
                        <div class="icon">📷</div>
                        <span>Image Loading...</span>
                    </div>`;
            }
        } else {
            // No image at all — show a nice placeholder
            imgSection = `
                <div class="card-img-placeholder">
                    <div class="icon">💍</div>
                    <span>Coming Soon</span>
                </div>`;
        }

        const badgeHtml = (priority === 1) ? `<div class="card-badge">${badgeEmoji} Top Selling</div>` : "";
        const catHtml = cat ? `<p class="card-category">${cat}</p>` : "";

        card.innerHTML = `
            <div class="card-img-wrapper">
                ${badgeHtml}
                ${imgSection}
            </div>
            <div class="card-info">
                ${catHtml}
                <p class="card-title">${name}</p>
                <p class="card-sku">SKU: ${sku}</p>
                <p class="card-price">₹${price}</p>
            </div>
        `;
        return card;
    }

    // ===== PRODUCT MODAL =====
    function openModal(sku) {
        const product = products.find(p => p["SKU Code"] === sku);
        if (!product) return;

        document.getElementById('mTitle').innerText = product["Product Name"] || "Jewelry";
        document.getElementById('mSku').innerText = "SKU: " + sku;
        document.getElementById('mPrice').innerText = "₹" + (product["Selling"] || "0");
        document.getElementById('mCat').innerText = product["Category"] || "";

        const message = encodeURIComponent(
            `Hi, I am interested in this item:\n\n` +
            `*${product["Product Name"]}*\n` +
            `*SKU:* ${sku}\n` +
            `*Price:* ₹${product["Selling"]}\n\n` +
            `Can you share more details?`
        );
        document.getElementById('mWhatsapp').href = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;

        // Handle Images
        const mImg = document.getElementById('mImg');
        const mThumbs = document.getElementById('mThumbs');
        mThumbs.innerHTML = "";
        clearInterval(rotationInterval);
        modalImages = [];
        currentImgIdx = 0;

        let rawImages = [
            product["Image 1"], product["Image 2"],
            product["Image 3"], product["Image 4"], product["Image 5"]
        ];
        rawImages.forEach(url => {
            if (url && String(url).trim().length > 5) {
                modalImages.push(cleanImageUrl(String(url).trim()));
            }
        });
        modalImages = [...new Set(modalImages)];

        if (modalImages.length === 0) {
            mImg.src = 'https://via.placeholder.com/400x400?text=Image+Not+Available';
            mThumbs.innerHTML = '<p style="color:#999; font-size:13px;">No images available for this product.</p>';
        } else {
            mImg.src = modalImages[0];
            
            modalImages.forEach((src, idx) => {
                const img = document.createElement('img');
                img.src = src;
                img.className = 'modal-thumb' + (idx === 0 ? ' active' : '');
                img.onclick = () => {
                    currentImgIdx = idx;
                    mImg.src = src;
                    updateModalThumbs();
                    startModalRotation();
                };
                mThumbs.appendChild(img);
            });

            if (modalImages.length > 1) startModalRotation();
        }

        document.body.style.overflow = 'hidden'; 
        document.getElementById('productModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('productModal').style.display = 'none';
        document.body.style.overflow = 'auto';
        clearInterval(rotationInterval);
    }

    // ===== MODAL IMAGE ROTATION =====
    function updateModalThumbs() {
        document.querySelectorAll('.modal-thumb').forEach((t, i) => 
            t.classList.toggle('active', i === currentImgIdx)
        );
    }
    
    function startModalRotation() {
        clearInterval(rotationInterval);
        rotationInterval = setInterval(() => {
            currentImgIdx = (currentImgIdx + 1) % modalImages.length;
            document.getElementById('mImg').src = modalImages[currentImgIdx];
            updateModalThumbs();
        }, ROTATION_SPEED);
    }
</script>

<script>
    if ('serviceWorker' in navigator) {

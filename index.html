<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Art By Tisha - Official Store</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="launchericon-192x192.png">

    <style>
        /* CSS VARIABLES FOR DARK/LIGHT MODE */
        :root {
            --bg-color: #fdf5f6;
            --primary: #d88fa0;
            --primary-dark: #c97a8d;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #999999;
            --text-sub: #b0a0a5;
            --border-color: #ecd3d8;
            --header-bg: #ffffff;
            --placeholder-bg: #f9f3f5;
            --discount-bg: #27ae60;
            --install-gradient-start: #d88fa0;
            --install-gradient-end: #c97a8d;
            --shadow-color: rgba(216, 143, 160, 0.15);
        }

        body.theme-dark {
            --bg-color: #121212;
            --primary: #e6b8c4;
            --primary-dark: #ffc4d4;
            --card-bg: #1e1e1e;
            --text-main: #f5f5f5;
            --text-muted: #aaaaaa;
            --text-sub: #888888;
            --border-color: #333333;
            --header-bg: #1e1e1e;
            --placeholder-bg: #2a2a2a;
            --discount-bg: #4ade80;
            --install-gradient-start: #e6b8c4;
            --install-gradient-end: #ffc4d4;
            --shadow-color: rgba(0, 0, 0, 0.6);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            margin: 0;
            padding: 0; 
            padding-bottom: 80px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ===== TOP BANNER ===== */
        .top-banner {
            background: var(--header-bg);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 15px var(--shadow-color);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: 0.3s;
        }
        .visitor-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(201, 122, 141, 0.3);
        }
        .live-dot {
            width: 8px; height: 8px;
            background: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(74, 222, 128, 0); }
            100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }
        .visitor-count {
            font-variant-numeric: tabular-nums;
        }

        .theme-toggle {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .theme-toggle:hover {
            transform: scale(1.1);
        }

        /* ===== HEADER ===== */
        header {
            background: var(--header-bg);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .header-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: contain;
            border: 2px solid var(--border-color);
            background: white;
        }
        .header-title {
            color: var(--primary-dark);
            margin: 8px 0 0 0;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header-tagline {
            color: var(--text-sub);
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* ===== CONTROLS ===== */
        .controls-container {
            padding: 15px;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .search-input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            text-align: center;
            background: var(--card-bg);
            color: var(--text-main);
            box-shadow: 0 4px 10px var(--shadow-color);
            transition: 0.3s;
        }
        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 4px 15px var(--shadow-color);
        }
        .filter-row {
            display: flex;
            gap: 10px;
        }
        .filter-select {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            outline: none;
            box-shadow: 0 2px 8px var(--shadow-color);
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23d88fa0%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 12px top 50%;
            background-size: 10px auto;
        }

        /* ===== SECTIONS ===== */
        .section-header {
            padding: 15px 15px 8px 15px;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-header .line {
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }
        .section-header .count {
            font-size: 11px;
            color: var(--text-sub);
            font-weight: 600;
        }

        /* ===== CAROUSEL ===== */
        .carousel-track {
            display: flex;
            gap: 15px;
            padding: 0 15px 15px 15px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .carousel-track::-webkit-scrollbar { display: none; }
        .carousel-track .product-card {
            flex: 0 0 calc(50% - 7.5px);
            scroll-snap-align: start;
        }

        /* ===== GRID & CARD ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 0 15px 5px 15px;
        }
        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 15px var(--shadow-color);
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            border: 1px solid var(--border-color);
        }
        .product-card:active { transform: scale(0.97); }
        .card-img-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: var(--placeholder-bg);
            position: relative;
        }
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-size: 9px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 2;
        }
        .discount-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--discount-bg);
            color: white;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 7px;
            border-radius: 6px;
            z-index: 2;
        }
        .card-img-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--placeholder-bg);
            color: var(--primary);
            font-size: 12px;
            font-weight: 600;
            gap: 6px;
        }
        .card-img-placeholder .icon { font-size: 30px; opacity: 0.5; }
        .card-info {
            padding: 12px 10px;
            text-align: center;
        }
        .card-category {
            font-size: 10px;
            color: var(--primary);
            font-weight: 800;
            text-transform: uppercase;
            margin: 0 0 3px 0;
            letter-spacing: 0.5px;
        }
        .card-title {
            font-size: 13px;
            color: var(--text-main);
            margin: 0 0 5px 0;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-sku {
            font-size: 11px;
            color: var(--text-muted);
            margin: 0 0 6px 0;
            text-transform: uppercase;
        }
        .card-price-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .card-mrp {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: line-through;
            margin: 0;
        }
        .card-price {
            font-size: 16px;
            color: var(--primary-dark);
            font-weight: 800;
            margin: 0;
        }
        .card-off {
            font-size: 11px;
            color: var(--discount-bg);
            font-weight: 700;
            margin: 2px 0 0 0;
        }

        /* ===== STATUS & MISC ===== */
        .status-msg {
            text-align: center;
            color: var(--primary);
            padding: 40px 20px;
            font-weight: 600;
        }
        .no-results {
            text-align: center;
            padding: 30px 15px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ===== MODAL ===== */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--card-bg);
            z-index: 1000;
            display: none;
            flex-direction: column;
            animation: slideUp 0.3s ease-out;
            overflow-y: auto;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: var(--card-bg);
            z-index: 10;
        }
        .back-btn {
            background: none; border: none; font-size: 24px; color: var(--text-main); cursor: pointer;
        }
        .modal-content {
            padding: 20px;
            padding-bottom: 100px;
        }
        .modal-img {
            width: 100%;
            height: 350px;
            object-fit: contain;
            background: var(--placeholder-bg);
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .thumb-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .modal-thumb {
            width: 50px; height: 50px; object-fit: cover;
            border: 2px solid var(--border-color); border-radius: 8px;
        }
        .modal-thumb.active { border-color: var(--primary); }
        
        .modal-cat { font-size: 12px; color: var(--primary); font-weight: bold; text-transform: uppercase; margin: 0 0 5px 0; }
        .modal-title { font-size: 22px; color: var(--text-main); margin: 0 0 5px 0; }
        .modal-sku { font-size: 13px; color: var(--text-muted); margin: 0 0 18px 0; }
        
        .modal-price-box {
            background: var(--placeholder-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 10px;
        }
        .modal-mrp-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        .modal-mrp-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .modal-mrp {
            font-size: 16px;
            color: var(--text-muted);
            text-decoration: line-through;
        }
        .modal-discount-pill {
            background: var(--discount-bg);
            color: white;
            font-size: 12px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .modal-price {
            font-size: 28px;
            color: var(--primary-dark);
            font-weight: 900;
            margin: 0;
        }
        .modal-price-note {
            font-size: 12px;
            color: var(--text-muted);
            margin: 4px 0 0 0;
        }
        
        .whatsapp-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: #25D366;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
            text-decoration: none;
            z-index: 1001;
        }

        #installBtn {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: linear-gradient(135deg, var(--install-gradient-start) 0%, var(--install-gradient-end) 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            cursor: pointer;
            display: none;
            animation: slideUp 0.5s ease;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- TOP BANNER: Visitor Counter + Theme Toggle -->
    <div class="top-banner">
        <div class="visitor-pill">
            <span class="live-dot"></span>
            <span>👁️ Visitors: <span class="visitor-count" id="visitNumber">...</span></span>
        </div>
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle theme">🌙</button>
    </div>

    <header>
        <img src="logo.png" alt="Logo" class="header-logo" onerror="this.style.display='none'">
        <h1 class="header-title">Art By Tisha</h1>
        <div class="header-tagline">Official Collection</div>
    </header>

    <div class="controls-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Search Collection..." oninput="applyFiltersAndSort()">
        
        <div class="filter-row">
            <select id="categoryFilter" class="filter-select" onchange="applyFiltersAndSort()">
                <option value="ALL">All Categories</option>
                <option value="TOP_SELLING">🔥 Top Selling</option>
                <option value="NO_CATEGORY">📂 Uncategorized</option>
            </select>
            
            <select id="sortFilter" class="filter-select" onchange="applyFiltersAndSort()">
                <option value="DEFAULT">Default Order</option>
                <option value="PRICE_ASC">Price: Low → High</option>
                <option value="PRICE_DESC">Price: High → Low</option>
                <option value="NAME_ASC">Name: A → Z</option>
            </select>
        </div>
    </div>

    <div id="status" class="status-msg">✨ Loading Collection...</div>

    <!-- TOP SELLING SLIDER -->
    <div id="carouselSection" style="display: none;">
        <div class="section-header">🏆 Featured Top Sellers <span class="line"></span></div>
        <div id="carouselTrack" class="carousel-track"></div>
    </div>

    <div id="productGrid"></div>

    <div id="productModal" class="modal">
        <div class="modal-header">
            <button class="back-btn" onclick="closeModal()">✕</button>
            <h3 style="margin:0; font-size:16px; color: var(--text-main);">Details</h3>
            <div style="width:24px;"></div>
        </div>
        <div class="modal-content">
            <img id="mImg" class="modal-img" src="" alt="Product">
            <div id="mThumbs" class="thumb-row"></div>
            <p id="mCat" class="modal-cat"></p>
            <h2 id="mTitle" class="modal-title"></h2>
            <p id="mSku" class="modal-sku"></p>

            <div class="modal-price-box">
                <div class="modal-mrp-row">
                    <span class="modal-mrp-label">MRP</span>
                    <span id="mMrp" class="modal-mrp"></span>
                    <span id="mDiscount" class="modal-discount-pill"></span>
                </div>
                <p id="mPrice" class="modal-price"></p>
                <p class="modal-price-note">Inclusive of all taxes</p>
            </div>
        </div>
        <a id="mWhatsapp" href="#" class="whatsapp-btn" target="_blank">
            💬 Inquire on WhatsApp
        </a>
    </div>

    <button id="installBtn" onclick="triggerInstall()">📲 Install Store App</button>

<script>
    const WHATSAPP_NUMBER = "918287567099";
    const SHEET_ID = "1h9RxfOCsIBul2HuSwWUAK8LQ8nrmriMK8IG_B1TD1BQ";
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Products`;

    // EXACT CUSTOM CATEGORY ORDER
    const CATEGORY_ORDER = ["BANGLES", "EARRINGS", "BRACELETS", "RINGS", "NECKLACES"];

    let products = [];
    
    const ROTATION_SPEED = 1500;
    const CAROUSEL_SPEED = 2000;
    let rotationInterval = null;
    let carouselInterval = null;
    let modalImages = [];
    let currentImgIdx = 0;

    // ===== PWA INSTALL =====
    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';
    });
    window.addEventListener('appinstalled', () => {
        deferredPrompt = null;
        installBtn.style.display = 'none';
    });
    function triggerInstall() {
        if (!deferredPrompt) {
            alert("To install: Tap browser menu (⋮) → 'Add to Home Screen'");
            return;
        }
        installBtn.style.display = 'none';
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
    }

    // ===== DARK / LIGHT MODE TOGGLE =====
    const themeToggleBtn = document.getElementById('themeToggle');
    
    function applyTheme(theme) {
        if (theme === 'dark') {
            document.body.classList.add('theme-dark');
            themeToggleBtn.innerText = '☀️';
        } else {
            document.body.classList.remove('theme-dark');
            themeToggleBtn.innerText = '🌙';
        }
    }

    function toggleTheme() {
        const isDark = document.body.classList.contains('theme-dark');
        if (isDark) {
            localStorage.setItem('abt_theme', 'light');
            applyTheme('light');
        } else {
            localStorage.setItem('abt_theme', 'dark');
            applyTheme('dark');
        }
    }

    // ===== VISITOR COUNT =====
    async function loadVisitorCount() {
        const visitEl = document.getElementById('visitNumber');
        try {
            const res = await fetch('https://api.counterapi.dev/v1/artbytisha_public/visits/up');
            if (!res.ok) throw new Error('API offline');
            const data = await res.json();
            const count = data.count ?? data.value ?? data.hits ?? 1;
            visitEl.innerText = count;
            localStorage.setItem('abt_public_visits', count);
        } catch (err) {
            // Local fallback if API blocked
            let localCount = parseInt(localStorage.getItem('abt_public_visits') || '0') + 1;
            localStorage.setItem('abt_public_visits', localCount);
            visitEl.innerText = localCount;
        }
    }

    // ===== PRICING =====
    function calcPricing(sellingRaw) {
        const selling = parseFloat(sellingRaw) || 0;
        const mrp = Math.round(selling * 1.6);
        const discount = mrp > 0 ? Math.round(((mrp - selling) / mrp) * 100) : 0;
        return {
            selling, mrp, discount,
            sellingText: "₹" + selling,
            mrpText: "₹" + mrp,
            discountText: discount + "% OFF"
        };
    }

    function cleanImageUrl(url) {
        if (!url) return '';
        url = url.trim();
        if (url.includes('drive.google.com')) {
            let fileId = '';
            const regD = /\/d\/([a-zA-Z0-9_-]+)/;
            const regId = /[?&]id=([a-zA-Z0-9_-]+)/;
            const mD = url.match(regD);
            const mId = url.match(regId);
            if (mD && mD[1]) fileId = mD[1];
            else if (mId && mId[1]) fileId = mId[1];
            if (fileId) return `https://lh3.googleusercontent.com/d/${fileId}`;
        }
        return url;
    }

    function hasValidImages(product) {
        for (let i = 1; i <= 5; i++) {
            const url = product[`Image ${i}`];
            if (url && String(url).trim().length > 5) return true;
        }
        return false;
    }

    function isTopSelling(product) {
        return (product["Category"] || "").trim().toUpperCase() === "TOP SELLING";
    }

    function sortList(list, sortFilter) {
        const arr = [...list];
        if (sortFilter === "PRICE_ASC") {
            arr.sort((a, b) => (parseFloat(a["Selling"]) || 0) - (parseFloat(b["Selling"]) || 0));
        } else if (sortFilter === "PRICE_DESC") {
            arr.sort((a, b) => (parseFloat(b["Selling"]) || 0) - (parseFloat(a["Selling"]) || 0));
        } else if (sortFilter === "NAME_ASC") {
            arr.sort((a, b) => (a["Product Name"] || "").localeCompare(b["Product Name"] || ""));
        }
        return arr;
    }

    function sortCategories(catArray) {
        return catArray.sort((a, b) => {
            const indexA = CATEGORY_ORDER.indexOf(a.toUpperCase());
            const indexB = CATEGORY_ORDER.indexOf(b.toUpperCase());
            if (indexA !== -1 && indexB !== -1) return indexA - indexB;
            if (indexA !== -1) return -1;
            if (indexB !== -1) return 1;
            return a.localeCompare(b);
        });
    }

    // ===== INIT =====
    window.onload = async function() {
        // 1. Restore saved theme immediately (no flash)
        const savedTheme = localStorage.getItem('abt_theme') || 'light';
        applyTheme(savedTheme);

        // 2. Trigger visitor count
        loadVisitorCount();

        // 3. Load products
        const statusEl = document.getElementById('status');
        try {
            const res = await fetch(CSV_URL);
            if (!res.ok) throw new Error();
            const text = await res.text();
            
            const lines = text.split('\n');
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const values = lines[i].split(',').map(v => v.trim().replace(/^"|"$/g, ''));
                const obj = {};
                headers.forEach((h, idx) => obj[h] = values[idx] !== undefined ? values[idx] : '');
                
                const isActive = String(obj["Active"]).toUpperCase().trim();
                if (isActive !== "FALSE" && isActive !== "0" && isActive !== "NO") {
                    products.push(obj);
                }
            }

            statusEl.style.display = 'none';
            populateCategories();
            applyFiltersAndSort();

        } catch (err) {
            statusEl.innerText = "❌ Could not load collection. Please try again later.";
        }
    };

    function populateCategories() {
        const catSelect = document.getElementById('categoryFilter');
        const uniqueCats = new Set();
        
        products.forEach(p => {
            const cat = (p["Category"] || "").trim();
            if (cat && cat.toUpperCase() !== "TOP SELLING") {
                uniqueCats.add(cat);
            }
        });

        const sortedCats = sortCategories(Array.from(uniqueCats));
        sortedCats.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.toUpperCase();
            opt.innerText = c;
            catSelect.appendChild(opt);
        });
    }

    function renderCarousel() {
        const topSellingItems = products.filter(p => isTopSelling(p));
        const section = document.getElementById('carouselSection');
        const track = document.getElementById('carouselTrack');

        clearInterval(carouselInterval);
        track.innerHTML = "";

        if (topSellingItems.length === 0) {
            section.style.display = 'none';
            return;
        }

        section.style.display = 'block';
        topSellingItems.forEach(item => track.appendChild(createCard(item, "⭐")));

        if (topSellingItems.length > 2) {
            let slideIndex = 0;
            carouselInterval = setInterval(() => {
                slideIndex++;
                if (slideIndex > topSellingItems.length - 2) slideIndex = 0;
                const card = track.children[slideIndex];
                if (card) {
                    track.scrollTo({ left: card.offsetLeft - 15, behavior: 'smooth' });
                }
            }, CAROUSEL_SPEED);
        }
    }

    function hideCarousel() {
        document.getElementById('carouselSection').style.display = 'none';
        clearInterval(carouselInterval);
    }

    function applyFiltersAndSort() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const catFilter = document.getElementById('categoryFilter').value;
        const sortFilter = document.getElementById('sortFilter').value;

        if (catFilter === "ALL" && query === "") {
            renderCarousel();
        } else {
            hideCarousel();
        }

        let filtered = products.filter(p => {
            const name = (p["Product Name"] || "").toLowerCase();
            const sku = (p["SKU Code"] || "").toLowerCase();
            const cat = (p["Category"] || "").trim().toUpperCase();

            const matchesSearch = !query || name.includes(query) || sku.includes(query);
            let matchesCat = true;

            switch (catFilter) {
                case "ALL": matchesCat = true; break;
                case "TOP_SELLING": matchesCat = cat === "TOP SELLING"; break;
                case "NO_CATEGORY": matchesCat = cat.length === 0; break;
                default: matchesCat = cat === catFilter;
            }
            return matchesSearch && matchesCat;
        });

        if (catFilter === "ALL") {
            let gridItems = filtered.filter(p => !isTopSelling(p));
            gridItems = sortList(gridItems, sortFilter);
            renderGroupedSections(gridItems);
        } else {
            let title = catFilter;
            if (catFilter === "TOP_SELLING") title = "🔥 Top Selling";
            if (catFilter === "NO_CATEGORY") title = "📂 Uncategorized";
            
            renderSection(document.getElementById('productGrid'), "", title, sortList(filtered, sortFilter), "✨", true);
        }
    }

    function renderGroupedSections(data) {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = "";

        if (data.length === 0) {
            grid.innerHTML = "<div class='no-results'>No items found matching your search.</div>";
            return;
        }

        const catGroups = {};
        const availDesigns = [];
        const comingSoon = [];

        data.forEach(p => {
            const cat = (p["Category"] || "").trim();
            if (cat) {
                if (!catGroups[cat]) catGroups[cat] = [];
                catGroups[cat].push(p);
            } else {
                if (hasValidImages(p)) availDesigns.push(p);
                else comingSoon.push(p);
            }
        });

        const sortedCats = sortCategories(Object.keys(catGroups));
        sortedCats.forEach(catName => {
            renderSection(grid, "📂", catName, catGroups[catName], "✨", false);
        });

        if (availDesigns.length > 0) {
            renderSection(grid, "🖼️", "Available Designs", availDesigns, "💎", false);
        }
        if (comingSoon.length > 0) {
            renderSection(grid, "📋", "More Coming Soon", comingSoon, "🕐", false);
        }
    }

    function renderSection(gridContainer, icon, title, items, badgeEmoji, clearFirst) {
        if (clearFirst) gridContainer.innerHTML = "";
        if (items.length === 0) {
            if (clearFirst) gridContainer.innerHTML = "<div class='no-results'>No items found matching your search.</div>";
            return;
        }

        const header = document.createElement('div');
        header.className = "section-header";
        const iconHtml = icon ? `${icon} ` : "";
        header.innerHTML = `${iconHtml}${title} <span class="count">(${items.length})</span> <span class="line"></span>`;
        gridContainer.appendChild(header);

        const gridEl = document.createElement('div');
        gridEl.className = "grid";
        items.forEach(item => gridEl.appendChild(createCard(item, badgeEmoji)));
        gridContainer.appendChild(gridEl);
    }

    function createCard(item, badgeEmoji) {
        const pricing = calcPricing(item["Selling"]);
        const name = item["Product Name"] || "Jewelry";
        const sku = item["SKU Code"] || "";
        const cat = (item["Category"] || "").trim();
        const isTop = isTopSelling(item);

        const card = document.createElement('div');
        card.className = "product-card";
        card.onclick = () => openModal(sku);

        let imgSection = '';
        if (hasValidImages(item)) {
            const imgSrc = cleanImageUrl(item["Image 1"]) || '';
            imgSection = imgSrc
                ? `<img src="${imgSrc}" class="card-img" loading="lazy">`
                : `<div class="card-img-placeholder"><div class="icon">📷</div><span>Image Loading...</span></div>`;
        } else {
            imgSection = `<div class="card-img-placeholder"><div class="icon">💍</div><span>Coming Soon</span></div>`;
        }

        const topBadge = isTop ? `<div class="card-badge">${badgeEmoji} Top Selling</div>` : "";
        const discBadge = pricing.discount > 0
            ? `<div class="discount-badge">${pricing.discountText}</div>`
            : "";
        const catHtml = cat ? `<p class="card-category">${cat}</p>` : "";

        card.innerHTML = `
            <div class="card-img-wrapper">
                ${topBadge}
                ${discBadge}
                ${imgSection}
            </div>
            <div class="card-info">
                ${catHtml}
                <p class="card-title">${name}</p>
                <p class="card-sku">SKU: ${sku}</p>
                <div class="card-price-row">
                    <p class="card-mrp">${pricing.mrpText}</p>
                    <p class="card-price">${pricing.sellingText}</p>
                    <p class="card-off">${pricing.discountText}</p>
                </div>
            </div>
        `;
        return card;
    }

    function openModal(sku) {
        const product = products.find(p => p["SKU Code"] === sku);
        if (!product) return;

        const pricing = calcPricing(product["Selling"]);

        document.getElementById('mTitle').innerText = product["Product Name"] || "Jewelry";
        document.getElementById('mSku').innerText = "SKU: " + sku;
        document.getElementById('mCat').innerText = product["Category"] || "";
        document.getElementById('mMrp').innerText = pricing.mrpText;
        document.getElementById('mDiscount').innerText = pricing.discountText;
        document.getElementById('mPrice').innerText = pricing.sellingText;

        const message = encodeURIComponent(
            `Hi, I am interested in this item:\n\n` +
            `*${product["Product Name"]}*\n` +
            `*SKU:* ${sku}\n` +
            `*MRP:* ${pricing.mrpText}\n` +
            `*Offer Price:* ${pricing.sellingText} (${pricing.discountText})\n\n` +
            `Can you share more details?`
        );
        document.getElementById('mWhatsapp').href = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;

        const mImg = document.getElementById('mImg');
        const mThumbs = document.getElementById('mThumbs');
        mThumbs.innerHTML = "";
        clearInterval(rotationInterval);
        modalImages = [];
        currentImgIdx = 0;

        let rawImages = [
            product["Image 1"], product["Image 2"],
            product["Image 3"], product["Image 4"], product["Image 5"]
        ];
        rawImages.forEach(url => {
            if (url && String(url).trim().length > 5) {
                modalImages.push(cleanImageUrl(String(url).trim()));
            }
        });
        modalImages = [...new Set(modalImages)];

        if (modalImages.length === 0) {
            mImg.src = 'https://via.placeholder.com/400x400?text=Image+Not+Available';
            mThumbs.innerHTML = '<p style="color:#999; font-size:13px;">No images available for this product.</p>';
        } else {
            mImg.src = modalImages[0];
            modalImages.forEach((src, idx) => {
                const img = document.createElement('img');
                img.src = src;
                img.className = 'modal-thumb' + (idx === 0 ? ' active' : '');
                img.onclick = () => {
                    currentImgIdx = idx;
                    mImg.src = src;
                    updateModalThumbs();
                    startModalRotation();
                };
                mThumbs.appendChild(img);
            });
            if (modalImages.length > 1) startModalRotation();
        }

        document.body.style.overflow = 'hidden'; 
        document.getElementById('productModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('productModal').style.display = 'none';
        document.body.style.overflow = 'auto';
        clearInterval(rotationInterval);
    }

    function updateModalThumbs() {
        document.querySelectorAll('.modal-thumb').forEach((t, i) => 
            t.classList.toggle('active', i === currentImgIdx)
        );
    }
    
    function startModalRotation() {
        clearInterval(rotationInterval);
        rotationInterval = setInterval(() => {
            currentImgIdx = (currentImgIdx + 1) % modalImages.length;
            document.getElementById('mImg').src = modalImages[currentImgIdx];
            updateModalThumbs();
        }, ROTATION_SPEED);
    }
</script>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Error:', err));
    }
</script>

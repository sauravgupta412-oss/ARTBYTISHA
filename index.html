<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Art By Tisha - Official Store</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="launchericon-192x192.png">

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #fdf5f6; 
            margin: 0;
            padding: 0; 
            padding-bottom: 80px;
        }

        header {
            background: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(216, 143, 160, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: contain;
            border: 2px solid #ecd3d8;
        }
        .header-title {
            color: #c97a8d;
            margin: 8px 0 0 0;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header-tagline {
            color: #b0a0a5;
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .controls-container {
            padding: 15px;
            background: #fdf5f6;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .search-input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ecd3d8;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(216, 143, 160, 0.08);
            transition: 0.3s;
        }
        .search-input:focus {
            border-color: #d88fa0;
            box-shadow: 0 4px 15px rgba(216, 143, 160, 0.2);
        }
        .filter-row {
            display: flex;
            gap: 10px;
        }
        .filter-select {
            flex: 1;
            padding: 12px;
            border: 1px solid #ecd3d8;
            border-radius: 12px;
            background: white;
            color: #555;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            box-shadow: 0 2px 8px rgba(216, 143, 160, 0.05);
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23d88fa0%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 12px top 50%;
            background-size: 10px auto;
        }

        .section-header {
            padding: 15px 15px 8px 15px;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #c97a8d;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-header .line {
            flex: 1;
            height: 1px;
            background: #ecd3d8;
        }
        .section-header .count {
            font-size: 11px;
            color: #b0a0a5;
            font-weight: 600;
        }

        .carousel-track {
            display: flex;
            gap: 15px;
            padding: 0 15px 15px 15px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .carousel-track::-webkit-scrollbar { display: none; }
        .carousel-track .product-card {
            flex: 0 0 calc(50% - 7.5px);
            scroll-snap-align: start;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 0 15px 5px 15px;
        }
        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .product-card:active { transform: scale(0.97); }
        .card-img-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #fff9fa;
            position: relative;
        }
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: linear-gradient(135deg, #f7a8b8, #c97a8d);
            color: white;
            font-size: 9px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(201, 122, 141, 0.4);
            z-index: 2;
        }
        .discount-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #27ae60;
            color: white;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 7px;
            border-radius: 6px;
            z-index: 2;
            box-shadow: 0 2px 6px rgba(39, 174, 96, 0.35);
        }
        .card-img-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f9f3f5;
            color: #d88fa0;
            font-size: 12px;
            font-weight: 600;
            gap: 6px;
        }
        .card-img-placeholder .icon { font-size: 30px; opacity: 0.5; }
        .card-info {
            padding: 12px 10px;
            text-align: center;
        }
        .card-category {
            font-size: 10px;
            color: #d88fa0;
            font-weight: 800;
            text-transform: uppercase;
            margin: 0 0 3px 0;
            letter-spacing: 0.5px;
        }
        .card-title {
            font-size: 13px;
            color: #333;
            margin: 0 0 5px 0;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-sku {
            font-size: 11px;
            color: #999;
            margin: 0 0 6px 0;
            text-transform: uppercase;
        }
        .card-price-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .card-mrp {
            font-size: 12px;
            color: #999;
            text-decoration: line-through;
            margin: 0;
        }
        .card-price {
            font-size: 16px;
            color: #c97a8d;
            font-weight: 800;
            margin: 0;
        }
        .card-off {
            font-size: 11px;
            color: #27ae60;
            font-weight: 700;
            margin: 2px 0 0 0;
        }

        .status-msg {
            text-align: center;
            color: #d88fa0;
            padding: 40px 20px;
            font-weight: 600;
        }
        .no-results {
            text-align: center;
            padding: 30px 15px;
            color: #999;
            font-size: 14px;
        }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 1000;
            display: none;
            flex-direction: column;
            animation: slideUp 0.3s ease-out;
            overflow-y: auto;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
        }
        .back-btn {
            background: none; border: none; font-size: 24px; color: #333; cursor: pointer;
        }
        .modal-content {
            padding: 20px;
            padding-bottom: 100px;
        }

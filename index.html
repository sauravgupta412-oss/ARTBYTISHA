<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Art By Tisha - Official Store</title>

    <!-- PWA META -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="launchericon-192x192.png">

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #fdf5f6; 
            margin: 0;
            padding: 0; 
            padding-bottom: 30px;
        }

        /* HEADER */
        header {
            background: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(216, 143, 160, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: contain;
            border: 2px solid #ecd3d8;
        }
        .header-title {
            color: #c97a8d;
            margin: 8px 0 0 0;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header-tagline {
            color: #b0a0a5;
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* SEARCH & FILTERS */
        .controls-container {
            padding: 15px;
            background: #fdf5f6;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .search-input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ecd3d8;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(216, 143, 160, 0.08);
            transition: 0.3s;
        }
        .search-input:focus {
            border-color: #d88fa0;
            box-shadow: 0 4px 15px rgba(216, 143, 160, 0.2);
        }
        .filter-row {
            display: flex;
            gap: 10px;
        }
        .filter-select {
            flex: 1;
            padding: 12px;
            border: 1px solid #ecd3d8;
            border-radius: 12px;
            background: white;
            color: #555;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            box-shadow: 0 2px 8px rgba(216, 143, 160, 0.05);
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23d88fa0%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 12px top 50%;
            background-size: 10px auto;
        }

        /* GRID LAYOUT */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 0 15px;
        }
        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .product-card:active {
            transform: scale(0.97);
        }
        .card-img-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #fff9fa;
            position: relative;
        }
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-info {
            padding: 12px;
            text-align: center;
        }
        .card-category {
            font-size: 10px;
            color: #d88fa0;
            font-weight: 800;
            text-transform: uppercase;
            margin: 0 0 3px 0;
            letter-spacing: 0.5px;
        }
        .card-title {
            font-size: 13px;
            color: #333;
            margin: 0 0 5px 0;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-sku {
            font-size: 11px;
            color: #999;
            margin: 0 0 5px 0;
            text-transform: uppercase;
        }
        .card-price {
            font-size: 16px;
            color: #c97a8d;
            font-weight: 800;
            margin: 0;
        }

        /* LOADING & ERROR */
        .status-msg {
            text-align: center;
            color: #d88fa0;
            padding: 40px 20px;
            font-weight: 600;
        }

        /* FULL SCREEN MODAL (Product Details) */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 1000;
            display: none;
            flex-direction: column;
            animation: slideUp 0.3s ease-out;
            overflow-y: auto;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
        }
        .back-btn {
            background: none; border: none; font-size: 24px; color: #333; cursor: pointer;
        }
        
        .modal-content {
            padding: 20px;
            padding-bottom: 100px;
        }
        .modal-img {
            width: 100%;
            height: 350px;
            object-fit: contain;
            background: #fff9fa;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .thumb-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .modal-thumb {
            width: 50px; height: 50px; object-fit: cover;
            border: 2px solid #eee; border-radius: 8px;
        }
        .modal-thumb.active { border-color: #d88fa0; }
        
        .modal-cat { font-size: 12px; color: #d88fa0; font-weight: bold; text-transform: uppercase; margin: 0 0 5px 0; }
        .modal-title { font-size: 22px; color: #333; margin: 0 0 5px 0; }
        .modal-sku { font-size: 13px; color: #888; margin: 0 0 15px 0; }
        .modal-price { font-size: 26px; color: #c97a8d; font-weight: 900; margin: 0 0 20px 0; }
        
        /* WHATSAPP BUTTON */
        .whatsapp-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: #25D366;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
            text-decoration: none;
            z-index: 1001;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <img src="logo.png" alt="Logo" class="header-logo" onerror="this.style.display='none'">
        <h1 class="header-title">Art By Tisha</h1>
        <div class="header-tagline">Official Collection</div>
    </header>

    <!-- SEARCH & FILTERS -->
    <div class="controls-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Search Collection..." onkeyup="applyFiltersAndSort()">
        
        <div class="filter-row">
            <select id="categoryFilter" class="filter-select" onchange="applyFiltersAndSort()">
                <option value="ALL">All Categories</option>
                <!-- Categories injected here automatically -->
            </select>
            
            <select id="sortFilter" class="filter-select" onchange="applyFiltersAndSort()">
                <option value="DEFAULT">Default Order</option>
                <option value="PRICE_ASC">Price: Low to High</option>
                <option value="PRICE_DESC">Price: High to Low</option>
            </select>
        </div>
    </div>

    <!-- STATUS -->
    <div id="status" class="status-msg">✨ Loading Collection...</div>

    <!-- GRID -->
    <div id="productGrid" class="grid"></div>

    <!-- PRODUCT MODAL -->
    <div id="productModal" class="modal">
        <div class="modal-header">
            <button class="back-btn" onclick="closeModal()">✕</button>
            <h3 style="margin:0; font-size:16px; color:#333;">Details</h3>
            <div style="width:24px;"></div> <!-- spacer -->
        </div>
        <div class="modal-content">
            <img id="mImg" class="modal-img" src="" alt="Product">
            <div id="mThumbs" class="thumb-row"></div>
            
            <p id="mCat" class="modal-cat"></p>
            <h2 id="mTitle" class="modal-title"></h2>
            <p id="mSku" class="modal-sku"></p>
            <p id="mPrice" class="modal-price"></p>
        </div>
        
        <!-- DIRECT WHATSAPP BUTTON (Number already hardcoded to 918287567099) -->
        <a id="mWhatsapp" href="#" class="whatsapp-btn" target="_blank">
            💬 Inquire on WhatsApp
        </a>
    </div>

<script>
    // --- APP CONFIGURATION ---
    const WHATSAPP_NUMBER = "918287567099"; // Added 91 for Indian Country Code
    const SHEET_ID = "1h9RxfOCsIBul2HuSwWUAK8LQ8nrmriMK8IG_B1TD1BQ";
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Products`;

    let products = [];
    
    // Auto-rotation variables
    const ROTATION_SPEED = 1500;
    let rotationInterval = null;
    let modalImages = [];
    let currentImgIdx = 0;

    // Helper: Clean Image URL
    function cleanImageUrl(url) {
        if (!url) return '';
        url = url.trim();
        if (url.includes('drive.google.com')) {
            let fileId = '';
            const regD = /\/d\/([a-zA-Z0-9_-]+)/;
            const regId = /[?&]id=([a-zA-Z0-9_-]+)/;
            const mD = url.match(regD);
            const mId = url.match(regId);
            if (mD && mD[1]) fileId = mD[1];
            else if (mId && mId[1]) fileId = mId[1];
            if (fileId) return `https://lh3.googleusercontent.com/d/${fileId}`;
        }
        return url;
    }

    // Initialize App
    window.onload = async function() {
        const statusEl = document.getElementById('status');
        try {
            const res = await fetch(CSV_URL);
            if (!res.ok) throw new Error();
            const text = await res.text();
            
            const lines = text.split('\n');
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const values = lines[i].split(',').map(v => v.trim().replace(/^"|"$/g, ''));
                const obj = {};
                headers.forEach((h, idx) => obj[h] = values[idx] !== undefined ? values[idx] : '');
                
                // Only push active products!
                const isActive = String(obj["Active"]).toUpperCase().trim();
                if (isActive !== "FALSE" && isActive !== "0" && isActive !== "NO") {
                    products.push(obj);
                }
            }

            statusEl.style.display = 'none';
            populateCategories(); // Generate Dropdown List
            applyFiltersAndSort(); // Render initial list

        } catch (err) {
            statusEl.innerText = "❌ Could not load collection. Please try again later.";
        }
    };

    // Extract categories and populate dropdown
    function populateCategories() {
        const catSelect = document.getElementById('categoryFilter');
        const uniqueCats = new Set();
        
        products.forEach(p => {
            // Checks for a column named "Category"
            const cat = (p["Category"] || "").trim().toUpperCase();
            if (cat) uniqueCats.add(cat);
        });

        // Sort categories alphabetically
        const sortedCats = Array.from(uniqueCats).sort();
        sortedCats.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c;
            opt.innerText = c;
            catSelect.appendChild(opt);
        });
    }

    // Apply Search, Category, and Sorting logic
    function applyFiltersAndSort() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const catFilter = document.getElementById('categoryFilter').value;
        const sortFilter = document.getElementById('sortFilter').value;

        // 1. FILTERING
        let filtered = products.filter(p => {
            const name = (p["Product Name"] || "").toLowerCase();
            const sku = (p["SKU Code"] || "").toLowerCase();
            const category = (p["Category"] || "").toUpperCase();
            
            const matchesSearch = name.includes(query) || sku.includes(query);
            const matchesCat = (catFilter === "ALL") || (category === catFilter);

            return matchesSearch && matchesCat;
        });

        // 2. SORTING
        if (sortFilter === "PRICE_ASC") {
            filtered.sort((a, b) => (parseFloat(a["Selling"]) || 0) - (parseFloat(b["Selling"]) || 0));
        } else if (sortFilter === "PRICE_DESC") {
            filtered.sort((a, b) => (parseFloat(b["Selling"]) || 0) - (parseFloat(a["Selling"]) || 0));
        }

        // 3. RENDER
        renderGrid(filtered);
    }

    // Render Grid HTML
    function renderGrid(data) {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = "";

        if (data.length === 0) {
            grid.innerHTML = "<p style='text-align:center; grid-column:span 2; color:#999; margin-top:30px;'>No items found matching your filters.</p>";
            return;
        }

        data.forEach(item => {
            let imgUrl = cleanImageUrl(item["Image 1"]) || 'https://via.placeholder.com/200x200?text=No+Image';
            
            const price = item["Selling"] || "0";
            const name = item["Product Name"] || "Elegant Jewelry";
            const sku = item["SKU Code"] || "";
            const cat = item["Category"] || "";

            const card = document.createElement('div');
            card.className = "product-card";
            card.onclick = () => openModal(sku); 
            
            // If there's a category, show it. Otherwise, hide the category tag on the card.
            const catHtml = cat ? `<p class="card-category">${cat}</p>` : "";

            card.innerHTML = `
                <div class="card-img-wrapper">
                    <img src="${imgUrl}" class="card-img" loading="lazy">
                </div>
                <div class="card-info">
                    ${catHtml}
                    <p class="card-title">${name}</p>
                    <p class="card-sku">SKU: ${sku}</p>
                    <p class="card-price">₹${price}</p>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // Open Product Modal
    function openModal(sku) {
        const product = products.find(p => p["SKU Code"] === sku);
        if (!product) return;

        document.getElementById('mTitle').innerText = product["Product Name"] || "Jewelry";
        document.getElementById('mSku').innerText = "SKU: " + sku;
        document.getElementById('mPrice').innerText = "₹" + (product["Selling"] || "0");
        document.getElementById('mCat').innerText = product["Category"] || "";

        // WhatsApp Link Generator
        const message = encodeURIComponent(`Hi, I am interested in ordering this item:\n\n*${product["Product Name"]}*\n*SKU:* ${sku}\n*Price:* ₹${product["Selling"]}\n\nCan you share more details?`);
        document.getElementById('mWhatsapp').href = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;

        // Handle Images
        const mImg = document.getElementById('mImg');
        const mThumbs = document.getElementById('mThumbs');
        mThumbs.innerHTML = "";
        clearInterval(rotationInterval);
        modalImages = [];
        currentImgIdx = 0;

        let rawImages = [product["Image 1"], product["Image 2"], product["Image 3"], product["Image 4"], product["Image 5"]];
        rawImages.forEach(url => {
            if (url && url.length > 5) modalImages.push(cleanImageUrl(url));
        });
        
        // Ensure uniqueness
        modalImages = [...new Set(modalImages)];

        if (modalImages.length === 0) {
            mImg.src = 'https://via.placeholder.com/400x400?text=No+Image';
        } else {
            mImg.src = modalImages[0];
            
            // Create Thumbs
            modalImages.forEach((src, idx) => {
                const img = document.createElement('img');
                img.src = src;
                img.className = 'modal-thumb' + (idx === 0 ? ' active' : '');
                img.onclick = () => {
                    currentImgIdx = idx;
                    mImg.src = src;
                    updateModalThumbs();
                    startModalRotation();
                };
                mThumbs.appendChild(img);
            });

            if (modalImages.length > 1) startModalRotation();
        }

        // Show Modal
        document.body.style.overflow = 'hidden'; 
        document.getElementById('productModal').style.display = 'flex';
    }

    // Close Modal
    function closeModal() {
        document.getElementById('productModal').style.display = 'none';
        document.body.style.overflow = 'auto';
        clearInterval(rotationInterval);
    }

    // Modal Image Rotation logic
    function updateModalThumbs() {
        const thumbs = document.querySelectorAll('.modal-thumb');
        thumbs.forEach((t, i) => t.classList.toggle('active', i === currentImgIdx));
    }
    
    function startModalRotation() {
        clearInterval(rotationInterval);
        rotationInterval = setInterval(() => {
            currentImgIdx = (currentImgIdx + 1) % modalImages.length;
            document.getElementById('mImg').src = modalImages[currentImgIdx];
            updateModalThumbs();
        }, ROTATION_SPEED);
    }

</script>

<!-- Service Worker Registration for PWA -->
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Error:', err));
    }
</script>

</body>
</html>
